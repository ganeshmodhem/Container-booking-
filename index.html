<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Container Booking Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#18212b}
header{background:#123b63;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:21px}header small{opacity:.85}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:9px;position:sticky;top:67px;z-index:4;border-bottom:1px solid #ddd}
nav button{border:0;background:#e9eef4;padding:10px 13px;border-radius:9px;white-space:nowrap;font-weight:bold}
nav button.active{background:#123b63;color:white}
main{max-width:900px;margin:auto;padding:15px}.page{display:none}.page.active{display:block}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
h2{margin:4px 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
label{font-size:12px;font-weight:bold;color:#52606d;display:block;margin-bottom:5px}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;font-size:14px;background:#fff}
textarea{min-height:75px;resize:vertical}.full{grid-column:1/-1}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer;margin:5px 3px 0 0}
.primary{background:#123b63;color:#fff}.success{background:#16834b;color:#fff}.warning{background:#d88900;color:#fff}.danger{background:#c0392b;color:#fff}.light{background:#e9eef4}
.search{display:flex;gap:8px}.search input{flex:1}.search button{width:auto}
.stage{display:flex;gap:5px;overflow:auto;margin:12px 0}.stage span{padding:7px 9px;border-radius:20px;background:#e9eef4;font-size:11px;white-space:nowrap}.stage .done{background:#d7f3e4;color:#12653b;font-weight:bold}
.badge{display:inline-block;padding:5px 8px;border-radius:15px;font-size:11px;font-weight:bold;background:#fff0c7;color:#805900}.badge.done{background:#d7f3e4;color:#12653b}
.list{margin-top:10px}.item{border:1px solid #e0e6ec;border-radius:11px;padding:12px;margin:8px 0;background:#fbfcfd}
.item b{color:#123b63}.muted{color:#687684;font-size:12px}.empty{text-align:center;color:#75818d;padding:30px}
.file{background:#f7f9fb;border:1px dashed #aeb9c5;padding:10px;border-radius:9px}
.hidden{display:none}.top-actions{display:flex;justify-content:space-between;gap:8px;align-items:center}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:10px}header{padding:13px}nav{top:58px}}
</style>
</head>
<body>
<header><h1>📦 Container Booking Manager</h1><small>Sales Contract → Booking → Advance Payment → Loading → Final Document</small></header>

<nav>
<button class="active" data-page="home">🏠 Home</button>
<button data-page="booking">🚢 Booking</button>
<button data-page="payment">💵 Advance</button>
<button data-page="loading">📦 Loading</button>
<button data-page="final">📄 Final</button>
</nav>

<main>
<section id="home" class="page active">
<div class="card">
<h2>📑 Sales Contract</h2>
<div class="search">
<input id="homeSearch" placeholder="Search Sales Contract No.">
<button class="btn primary" onclick="searchContract()">Search</button>
</div>
<div id="searchResult" class="list"></div>
</div>

<div class="card">
<h2>➕ New Sales Contract</h2>
<div class="grid">
<div><label>Sales Contract No.</label><input id="scNo" placeholder="e.g. SC-001"></div>
<div><label>Customer / Buyer</label><input id="buyer"></div>
<div><label>Product</label><input id="product"></div>
<div><label>Total Quantity</label><input id="qty" type="number" step="0.001"></div>
<div><label>Contract Date</label><input id="contractDate" type="date"></div>
<div><label>Currency</label><input value="USD" disabled></div>
<div class="full"><label>Sales Contract PDF / Image</label><input id="scFile" class="file" type="file" accept=".pdf,image/*"></div>
</div>
<button class="btn primary" onclick="createContract()">Create Sales Contract</button>
</div>

<div class="card">
<h2>📋 All Contracts</h2>
<div id="contractList"></div>
</div>
</section>

<section id="booking" class="page">
<div class="card">
<h2>🚢 Booking</h2>
<div class="search"><input id="bookingSearch" placeholder="Enter Sales Contract No."><button class="btn primary" onclick="loadStage('booking')">Search</button></div>
<div id="bookingBox" class="list"></div>
</div>
</section>

<section id="payment" class="page">
<div class="card">
<h2>💵 Advance Payment — USD</h2>
<div class="search"><input id="paymentSearch" placeholder="Enter Sales Contract No."><button class="btn primary" onclick="loadStage('payment')">Search</button></div>
<div id="paymentBox" class="list"></div>
</div>
</section>

<section id="loading" class="page">
<div class="card">
<h2>📦 Loading</h2>
<div class="search"><input id="loadingSearch" placeholder="Enter Sales Contract No."><button class="btn primary" onclick="loadStage('loading')">Search</button></div>
<div id="loadingBox" class="list"></div>
</div>
</section>

<section id="final" class="page">
<div class="card">
<h2>📄 Final Document</h2>
<div class="search"><input id="finalSearch" placeholder="Enter Sales Contract No."><button class="btn primary" onclick="loadStage('final')">Search</button></div>
<div id="finalBox" class="list"></div>
</div>
</section>
</main>

<script>
const KEY="containerBookingManager_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"contracts":[]}');

function save(){localStorage.setItem(KEY,JSON.stringify(db));renderContracts()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function getSC(no){return db.contracts.find(x=>x.no.toLowerCase()===String(no||'').trim().toLowerCase())}
function fileInfo(input){return input.files[0]?{name:input.files[0].name,type:input.files[0].type}:null}

function createContract(){
 let no=scNo.value.trim(); if(!no)return alert("Sales Contract No. required");
 if(getSC(no))return alert("This Sales Contract already exists.");
 db.contracts.push({
  no,buyer:buyer.value.trim(),product:product.value.trim(),qty:qty.value,
  date:contractDate.value,contractFile:fileInfo(scFile),
  booking:[],payment:null,loading:[],final:null,created:new Date().toISOString()
 });
 save(); alert("Sales Contract created successfully."); scNo.value=buyer.value=product.value=qty.value=contractDate.value=scFile.value="";
 showContract(no);
}
function renderContracts(){
 const el=document.getElementById('contractList');
 if(!db.contracts.length){el.innerHTML='<div class="empty">No Sales Contracts yet.</div>';return}
 el.innerHTML=db.contracts.slice().reverse().map(c=>`
 <div class="item">
  <div class="top-actions"><b>${esc(c.no)}</b><span class="badge ${c.final?'done':''}">${c.final?'COMPLETED':'IN PROGRESS'}</span></div>
  <div class="muted">${esc(c.buyer||'-')} • ${esc(c.product||'-')} • Qty: ${esc(c.qty||'-')}</div>
  <div class="stage">
   <span class="done">Contract ✓</span><span class="${c.booking.length?'done':''}">Booking ${c.booking.length?'✓':''}</span>
   <span class="${c.payment?'done':''}">Advance ${c.payment?'✓':''}</span>
   <span class="${c.loading.length?'done':''}">Loading ${c.loading.length?'✓':''}</span>
   <span class="${c.final?'done':''}">Final ${c.final?'✓':''}</span>
  </div>
  <button class="btn primary" onclick="showContract('${esc(c.no)}')">Open</button>
 </div>`).join('')
}
function searchContract(){
 let c=getSC(homeSearch.value); searchResult.innerHTML=c?contractCard(c):'<div class="empty">Contract not found.</div>'
}
function showContract(no){
 homeSearch.value=no;let c=getSC(no);searchResult.innerHTML=contractCard(c);
 document.querySelector('[data-page="home"]').click()
}
function contractCard(c){
 return `<div class="item"><b>${esc(c.no)}</b><p>Buyer: ${esc(c.buyer||'-')}<br>Product: ${esc(c.product||'-')}<br>Quantity: ${esc(c.qty||'-')}</p>
 <button class="btn primary" onclick="openStage('booking','${esc(c.no)}')">Booking</button>
 <button class="btn warning" onclick="openStage('payment','${esc(c.no)}')">Advance Payment</button>
 <button class="btn success" onclick="openStage('loading','${esc(c.no)}')">Loading</button>
 <button class="btn light" onclick="openStage('final','${esc(c.no)}')">Final Document</button></div>`
}
function openStage(page,no){
 document.querySelector(`[data-page="${page}"]`).click();
 document.getElementById(page+'Search').value=no;loadStage(page)
}
function nav(){
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active')
 })
}
function loadStage(page){
 let no=document.getElementById(page+'Search').value,c=getSC(no),box=document.getElementById(page+'Box');
 if(!c){box.innerHTML='<div class="empty">Sales Contract not found.</div>';return}
 if(page==='booking')renderBooking(c,box);
 if(page==='payment')renderPayment(c,box);
 if(page==='loading')renderLoading(c,box);
 if(page==='final')renderFinal(c,box);
}
function renderBooking(c,box){
 box.innerHTML=`<div class="item"><b>${esc(c.no)}</b><div class="muted">${esc(c.buyer||'')} | Qty ${esc(c.qty||'')}</div></div>
 <div class="card"><h3>Add Booking</h3><div class="grid">
 <div><label>Booking No.</label><input id="bNo"></div><div><label>Container No.</label><input id="bCont"></div>
 <div><label>Quantity</label><input id="bQty" type="number" step="0.001"></div><div><label>Vessel</label><input id="bVessel"></div>
 <div><label>ETD</label><input id="bETD" type="date"></div><div><label>ETA</label><input id="bETA" type="date"></div>
 <div class="full"><label>Booking Document</label><input id="bFile" class="file" type="file" accept=".pdf,image/*"></div>
 </div><button class="btn primary" onclick="addBooking('${esc(c.no)}')">Save Booking</button></div>
 <h3>Bookings</h3>${c.booking.length?c.booking.map((b,i)=>`<div class="item"><b>Booking ${i+1} — ${esc(b.no)}</b><br>Container: ${esc(b.container)} | Qty: ${esc(b.qty)}<br>Vessel: ${esc(b.vessel||'-')} | ETA: ${esc(b.eta||'-')}<br><button class="btn success" onclick="openStage('payment','${esc(c.no)}')">Release / Advance Payment →</button></div>`).join(''):'<div class="empty">No booking added.</div>'}`
}
function addBooking(no){
 let c=getSC(no);c.booking.push({no:bNo.value,container:bCont.value,qty:bQty.value,vessel:bVessel.value,etd:bETD.value,eta:bETA.value,file:fileInfo(bFile),date:new Date().toISOString()});save();loadStage('booking');alert("Booking saved.")
}
function renderPayment(c,box){
 box.innerHTML=`<div class="item"><b>${esc(c.no)}</b><div class="muted">Advance Payment — USD</div></div>
 <div class="card"><div class="grid">
 <div><label>Advance Amount (USD)</label><input id="pAmt" type="number" step="0.01"></div>
 <div><label>Payment Date</label><input id="pDate" type="date"></div>
 <div><label>Bank / Payment Reference</label><input id="pRef"></div>
 <div><label>Status</label><select id="pStatus"><option>Paid</option><option>Pending</option></select></div>
 <div class="full"><label>Payment Copy</label><input id="pFile" class="file" type="file" accept=".pdf,image/*"></div>
 </div><button class="btn primary" onclick="savePayment('${esc(c.no)}')">Save Advance Payment</button></div>
 ${c.payment?`<div class="item"><b>Saved Payment</b><br>USD ${esc(c.payment.amount)} | ${esc(c.payment.date||'-')} | ${esc(c.payment.status)}<br>Reference: ${esc(c.payment.ref||'-')}<br><button class="btn success" onclick="openStage('loading','${esc(c.no)}')">Loading →</button></div>`:''}`
}
function savePayment(no){let c=getSC(no);c.payment={amount:pAmt.value,date:pDate.value,ref:pRef.value,status:pStatus.value,file:fileInfo(pFile)};save();loadStage('payment');alert("Advance payment saved.")}
function renderLoading(c,box){
 box.innerHTML=`<div class="item"><b>${esc(c.no)}</b></div>
 <div class="card"><h3>Add Loading</h3><div class="grid">
 <div><label>Container No.</label><input id="lCont"></div><div><label>Loaded Quantity</label><input id="lQty" type="number" step="0.001"></div>
 <div><label>Loading Date</label><input id="lDate" type="date"></div><div><label>Seal No.</label><input id="lSeal"></div>
 <div class="full"><label>Loading Document / Image</label><input id="lFile" class="file" type="file" accept=".pdf,image/*"></div>
 </div><button class="btn primary" onclick="addLoading('${esc(c.no)}')">Save Loading</button></div>
 <h3>Loading Records</h3>${c.loading.length?c.loading.map((l,i)=>`<div class="item"><b>Loading ${i+1}</b><br>Container: ${esc(l.container)} | Qty: ${esc(l.qty)}<br>Date: ${esc(l.date||'-')} | Seal: ${esc(l.seal||'-')}</div>`).join(''):'<div class="empty">No loading record.</div>'}`
}
function addLoading(no){let c=getSC(no);c.loading.push({container:lCont.value,qty:lQty.value,date:lDate.value,seal:lSeal.value,file:fileInfo(lFile)});save();loadStage('loading');alert("Loading saved.")}
function renderFinal(c,box){
 box.innerHTML=`<div class="item"><b>${esc(c.no)}</b><div class="stage">
 <span class="done">Contract ✓</span><span class="${c.booking.length?'done':''}">Booking ${c.booking.length?'✓':''}</span>
 <span class="${c.payment?'done':''}">Advance ${c.payment?'✓':''}</span><span class="${c.loading.length?'done':''}">Loading ${c.loading.length?'✓':''}</span><span class="${c.final?'done':''}">Final ${c.final?'✓':''}</span></div></div>
 <div class="card"><h3>Final Document</h3><label>Final Document PDF / Image</label><input id="fFile" class="file" type="file" accept=".pdf,image/*">
 <button class="btn success" onclick="saveFinal('${esc(c.no)}')">Save Final Document & Complete</button></div>
 ${c.final?`<div class="item"><b>✅ COMPLETED</b><br>Final document: ${esc(c.final.file?.name||'-')}<br>Completed: ${new Date(c.final.date).toLocaleString()}</div>`:''}`
}
function saveFinal(no){let c=getSC(no);c.final={file:fileInfo(fFile),date:new Date().toISOString()};save();loadStage('final');alert("Final record completed successfully.")}
nav();renderContracts();
</script>
</body>
</html>
