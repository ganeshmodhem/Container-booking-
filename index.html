<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Contract Booking Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17212b}
header{background:#123b63;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:20px;margin:0 0 4px}header small{opacity:.85}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px;position:sticky;top:65px;z-index:9;border-bottom:1px solid #ddd}
nav button{border:0;border-radius:9px;padding:10px 12px;white-space:nowrap;font-weight:bold;background:#e9eef4;color:#263746}
nav button.active{background:#123b63;color:#fff}nav button.locked{opacity:.45}
main{max-width:900px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
h2{font-size:19px;margin:2px 0 13px}h3{margin:7px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:bold;color:#5b6977;display:block;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;font-size:14px;background:#fff}
.search{display:flex;gap:7px}.search input{flex:1}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer;margin:6px 4px 0 0}
.primary{background:#123b63;color:#fff}.success{background:#16834b;color:#fff}.warning{background:#d88900;color:#fff}.light{background:#e8edf2}.danger{background:#c0392b;color:#fff}
.item{border:1px solid #dce3ea;border-radius:11px;padding:12px;margin:9px 0;background:#fbfcfd}
.muted{font-size:12px;color:#687684}.empty{text-align:center;color:#788692;padding:25px}
.badge{display:inline-block;border-radius:15px;padding:5px 8px;font-size:11px;font-weight:bold;background:#fff0c7;color:#795800}
.done{background:#d7f3e4;color:#12653b}.stage{display:flex;gap:5px;overflow:auto;margin:10px 0}.stage span{white-space:nowrap;font-size:11px;padding:6px 8px;border-radius:18px;background:#e9eef4}.stage .done{font-weight:bold}
.file{border-style:dashed}.notice{padding:10px;border-radius:9px;background:#fff6dc;margin:8px 0;font-size:13px}
.successbox{padding:12px;border-radius:10px;background:#e2f7eb;color:#145b38;font-weight:bold}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}nav{top:61px}}
</style>
</head>
<body>
<header><h1>📦 Sales Contract Booking Manager</h1><small>Contract → Booking → Release → USD Payment → Final Record</small></header>
<nav>
<button data-page="home" class="active">🏠 Home</button>
<button data-page="booking">🚢 Booking</button>
<button data-page="payment">💵 Payment</button>
<button data-page="final">📄 Final Record</button>
</nav>

<main>
<section id="home" class="page active">
<div class="card">
<h2>🔎 Search Sales Contract</h2>
<div class="search"><input id="homeSearch" placeholder="Sales Contract No."><button class="btn primary" onclick="searchHome()">Search</button></div>
<div id="homeResult"></div>
</div>
<div class="card">
<h2>📑 Upload / Create Sales Contract</h2>
<div class="grid">
<div><label>Sales Contract No.</label><input id="scNo"></div>
<div><label>Customer / Buyer</label><input id="buyer"></div>
<div><label>Product</label><input id="product"></div>
<div><label>Total Quantity</label><input id="qty" type="number" step="0.001"></div>
<div><label>Contract Date</label><input id="scDate" type="date"></div>
<div><label>Currency</label><input value="USD" disabled></div>
<div class="full"><label>Sales Contract PDF / Image</label><input id="scFile" class="file" type="file" accept=".pdf,image/*"></div>
</div>
<button class="btn primary" onclick="createSC()">Save Sales Contract</button>
</div>
<div class="card"><h2>📋 Sales Contracts</h2><div id="allSC"></div></div>
</section>

<section id="booking" class="page">
<div class="card">
<h2>🚢 Booking</h2>
<div class="search"><input id="bookingSearch" placeholder="Sales Contract No."><button class="btn primary" onclick="findStage('booking')">Search</button></div>
<div id="bookingBox"></div>
</div>
</section>

<section id="payment" class="page">
<div class="card">
<h2>💵 USD Payment</h2>
<div class="search"><input id="paymentSearch" placeholder="Sales Contract No."><button class="btn primary" onclick="findStage('payment')">Search</button></div>
<div id="paymentBox"></div>
</div>
</section>

<section id="final" class="page">
<div class="card">
<h2>📄 Final Record</h2>
<div class="search"><input id="finalSearch" placeholder="Sales Contract No."><button class="btn primary" onclick="findStage('final')">Search</button></div>
<div id="finalBox"></div>
</div>
</section>
</main>

<script>
const DBKEY="SC_BOOKING_MANAGER_V2";
let db=JSON.parse(localStorage.getItem(DBKEY)||'{"contracts":[]}');
let currentSC="";

function save(){localStorage.setItem(DBKEY,JSON.stringify(db));renderAll();}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function getSC(no){return db.contracts.find(c=>c.no.toLowerCase()===String(no||"").trim().toLowerCase())}
function fi(id){let f=document.getElementById(id)?.files?.[0];return f?{name:f.name,type:f.type}:null}
function createSC(){
 let no=scNo.value.trim();if(!no)return alert("Sales Contract No. required.");
 if(getSC(no))return alert("This Sales Contract already exists.");
 db.contracts.push({no,buyer:buyer.value,product:product.value,qty:qty.value,date:scDate.value,file:fi("scFile"),bookings:[],payment:null,final:null,created:new Date().toISOString()});
 save();currentSC=no;alert("Sales Contract saved.");openStage("booking",no);
}
function renderAll(){
 let el=document.getElementById("allSC");
 if(!db.contracts.length){el.innerHTML='<div class="empty">No Sales Contract found.</div>';return}
 el.innerHTML=db.contracts.slice().reverse().map(c=>`
 <div class="item"><b>${esc(c.no)}</b> <span class="badge ${c.final?"done":""}">${c.final?"COMPLETED":"IN PROGRESS"}</span>
 <div class="muted">${esc(c.buyer||"-")} | ${esc(c.product||"-")} | Qty ${esc(c.qty||"-")}</div>
 <div class="stage"><span class="done">Contract ✓</span><span class="${c.bookings.length?"done":""}">Booking ${c.bookings.length?"✓":""}</span><span class="${c.payment?"done":""}">Payment ${c.payment?"✓":""}</span><span class="${c.final?"done":""}">Final ${c.final?"✓":""}</span></div>
 <button class="btn primary" onclick="openStage('booking','${esc(c.no)}')">Open Contract</button></div>`).join("");
 updateNav();
}
function searchHome(){let c=getSC(homeSearch.value);homeResult.innerHTML=c?homeCard(c):'<div class="empty">Sales Contract not found.</div>'}
function homeCard(c){return `<div class="item"><b>${esc(c.no)}</b><p>Buyer: ${esc(c.buyer||"-")}<br>Product: ${esc(c.product||"-")}<br>Quantity: ${esc(c.qty||"-")}</p><button class="btn primary" onclick="openStage('booking','${esc(c.no)}')">Go to Booking</button></div>`}
function navClick(page){
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 document.querySelector(`[data-page="${page}"]`).classList.add("active");
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(page).classList.add("active");
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.classList.contains("locked"))return;navClick(b.dataset.page)});
function updateNav(){
 let c=getSC(currentSC);
 document.querySelector('[data-page="payment"]').classList.toggle("locked",!(c&&c.bookings.some(b=>b.released)));
 document.querySelector('[data-page="final"]').classList.toggle("locked",!(c&&c.payment&&c.payment.status==="Paid"));
}
function openStage(page,no){
 let c=getSC(no);if(!c)return;
 currentSC=no;
 if(page==="payment" && !c.bookings.some(b=>b.released))return alert("Booking must be Released first.");
 if(page==="final" && !(c.payment&&c.payment.status==="Paid"))return alert("Payment must be completed first.");
 navClick(page);
 let inp=document.getElementById(page+"Search");inp.value=no;findStage(page);
}
function findStage(page){
 let no=document.getElementById(page+"Search").value,c=getSC(no),box=document.getElementById(page+"Box");
 currentSC=no;updateNav();
 if(!c){box.innerHTML='<div class="empty">Sales Contract not found.</div>';return}
 if(page==="booking")bookingUI(c,box);
 if(page==="payment")paymentUI(c,box);
 if(page==="final")finalUI(c,box);
}
function contractHeader(c){return `<div class="item"><b>${esc(c.no)}</b><div class="muted">${esc(c.buyer||"-")} | ${esc(c.product||"-")} | Qty ${esc(c.qty||"-")}</div></div>`}
function bookingUI(c,box){
 box.innerHTML=contractHeader(c)+`
 <div class="card"><h3>➕ Add Booking</h3><div class="grid">
 <div><label>Booking No.</label><input id="bNo"></div><div><label>Container No.</label><input id="bCont"></div>
 <div><label>Quantity</label><input id="bQty" type="number" step="0.001"></div><div><label>Vessel</label><input id="bVessel"></div>
 <div><label>ETD</label><input id="bETD" type="date"></div><div><label>ETA</label><input id="bETA" type="date"></div>
 <div class="full"><label>Booking Document</label><input id="bFile" class="file" type="file" accept=".pdf,image/*"></div>
 </div><button class="btn primary" onclick="addBooking('${esc(c.no)}')">Save Booking</button></div>
 <h3>All Bookings</h3>
 ${c.bookings.length?c.bookings.map((b,i)=>`<div class="item"><b>Booking ${i+1}: ${esc(b.no||"-")}</b>
 <br>Container: ${esc(b.container||"-")} | Quantity: ${esc(b.qty||"-")}<br>Vessel: ${esc(b.vessel||"-")} | ETA: ${esc(b.eta||"-")}
 <br>${b.released?'<span class="badge done">RELEASED ✓</span>':'<span class="badge">NOT RELEASED</span>'}
 ${b.released?`<button class="btn success" onclick="openStage('payment','${esc(c.no)}')">Go to Payment →</button>`:`<button class="btn warning" onclick="releaseBooking('${esc(c.no)}',${i})">🚢 RELEASE</button>`}
 </div>`).join(""):'<div class="empty">No bookings yet.</div>'}`;
}
function addBooking(no){
 if(!bNo.value.trim())return alert("Booking No. required.");
 let c=getSC(no);c.bookings.push({no:bNo.value,container:bCont.value,qty:bQty.value,vessel:bVessel.value,etd:bETD.value,eta:bETA.value,file:fi("bFile"),released:false});
 save();bookingUI(c,document.getElementById("bookingBox"));alert("Booking saved.");
}
function releaseBooking(no,i){
 let c=getSC(no);c.bookings[i].released=true;c.bookings[i].releaseDate=new Date().toISOString();save();
 alert("Booking Released. Now Payment page is unlocked.");openStage("payment",no);
}
function paymentUI(c,box){
 let released=c.bookings.filter(b=>b.released);
 if(!released.length){box.innerHTML=contractHeader(c)+'<div class="notice">🔒 Payment is locked. Release at least one Booking first.</div>';return}
 box.innerHTML=contractHeader(c)+`
 <div class="successbox">Booking Released ✓ — Payment page unlocked</div>
 <div class="card"><h3>💵 Advance / Document Payment</h3><div class="grid">
 <div><label>Payment Amount (USD)</label><input id="pAmt" type="number" step="0.01"></div>
 <div><label>Payment Date</label><input id="pDate" type="date"></div>
 <div><label>Payment Reference</label><input id="pRef"></div>
 <div><label>Status</label><select id="pStatus"><option>Paid</option><option>Pending</option></select></div>
 <div class="full"><label>Payment Copy</label><input id="pFile" class="file" type="file" accept=".pdf,image/*"></div>
 </div><button class="btn success" onclick="completePayment('${esc(c.no)}')">💵 PAYMENT DONE</button></div>
 ${c.payment?`<div class="item"><b>Saved Payment</b><br>USD ${esc(c.payment.amount)} | ${esc(c.payment.date||"-")} | ${esc(c.payment.status)}<br>Reference: ${esc(c.payment.ref||"-")}
 ${c.payment.status==="Paid"?`<br><button class="btn primary" onclick="openStage('final','${esc(c.no)}')">Go to Final Record →</button>`:""}</div>`:""}`;
}
function completePayment(no){
 let c=getSC(no);
 if(pStatus.value!=="Paid")return alert("Set Payment Status to Paid before going to Final Record.");
 if(!pAmt.value)return alert("Payment Amount (USD) required.");
 c.payment={amount:pAmt.value,date:pDate.value,ref:pRef.value,status:"Paid",file:fi("pFile"),doneDate:new Date().toISOString()};
 save();alert("Payment completed. Final Record is now unlocked.");openStage("final",no);
}
function finalUI(c,box){
 if(!(c.payment&&c.payment.status==="Paid")){box.innerHTML=contractHeader(c)+'<div class="notice">🔒 Final Record is locked. Complete USD Payment first.</div>';return}
 box.innerHTML=contractHeader(c)+`
 <div class="successbox">Payment Completed ✓ — Final Record unlocked</div>
 <div class="card"><h3>📄 Final Document</h3><label>Upload Final Document PDF / Image</label>
 <input id="fFile" class="file" type="file" accept=".pdf,image/*">
 <button class="btn success" onclick="completeFinal('${esc(c.no)}')">✅ SAVE FINAL RECORD</button></div>
 ${c.final?`<div class="item"><b>✅ COMPLETED</b><br>Final Document: ${esc(c.final.file?.name||"-")}<br>Completed: ${new Date(c.final.date).toLocaleString()}</div>`:""}`;
}
function completeFinal(no){
 let c=getSC(no),f=fi("fFile");if(!f)return alert("Upload Final Document first.");
 c.final={file:f,date:new Date().toISOString()};save();finalUI(c,document.getElementById("finalBox"));alert("Final Record completed successfully.");
}
renderAll();
</script>
</body>
</html>
