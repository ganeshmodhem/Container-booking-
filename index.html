<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Contract Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Arial;color:#1d2a35}header{background:#123f68;color:white;text-align:center;padding:18px 10px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header p{margin:7px 0;font-size:14px}
nav{display:flex;overflow:auto;gap:7px;background:white;padding:8px;position:sticky;top:86px;z-index:4}nav button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;white-space:nowrap}nav .on{background:#123f68;color:#fff}nav .lock{opacity:.55}nav button{cursor:pointer}nav{z-index:20}
main{width:98vw;max-width:none;margin:0 auto;padding:14px}.page{display:none}.page.on{display:block}.card{background:#fff;padding:15px;border-radius:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}h2{margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:bold;color:#5b6875;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5de;border-radius:10px;font-size:14px}textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;margin:6px 4px 0 0}.p{background:#123f68;color:white}.s{background:#16844d;color:white}.w{background:#d88900;color:white}.file{border-style:dashed}.item{border:1px solid #dde4eb;border-radius:10px;padding:12px;margin:9px 0}.muted{font-size:12px;color:#6d7882}.ok{background:#e1f6ea;color:#155d39;padding:10px;border-radius:9px;margin:8px 0}.notice{background:#fff5d8;padding:10px;border-radius:9px;font-size:13px}.search{display:flex;gap:7px}.search input{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}table thead th{background:#eef3f7;white-space:nowrap;border-bottom:2px solid #cbd5df}table tbody tr:hover{background:#f8fafc}table tbody td{white-space:nowrap}.registerWrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.registerWrap table{min-width:max-content}.badge{padding:5px 8px;border-radius:15px;background:#d9f4e5;color:#14613c;font-size:11px;font-weight:bold}
@media(max-width:650px){main{width:100%;padding:8px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><h1>📦 Import Contract Tracker</h1><p>Contract → Booking → Advance → Loading/B/L → Invoice → BOE → Final Payment → Final Record</p></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const K="IMPORT_TRACKER_V2";let db=JSON.parse(localStorage.getItem(K)||'{"contracts":[]}'),cur="";
const stages=[["home","🏠 Contract"],["booking","🚢 Booking"],["advance","💵 Advance"],["loading","📦 Loading/B/L"],["invoice","🧾 Invoice"],["boe","🛃 Bill of Entry"],["finalpay","💰 Final Payment"],["final","📄 Final Record"]];
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function file(id){let f=$(id)?.files?.[0];return f?{name:f.name,type:f.type}:null}
function get(n){return db.contracts.find(x=>x.no.toLowerCase()===String(n||"").trim().toLowerCase())}
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function saveSilently(){localStorage.setItem(K,JSON.stringify(db))}
function nav(){let c=get(cur);$("nav").innerHTML=stages.map(([id,t])=>{let lock=({loading:!c?.bookings?.some(x=>x.advance),invoice:!c?.loading,boe:!c?.invoice,finalpay:!c?.boe,final:!c?.finalpay}[id]||false);return `<button class="${id===page?'on ':''}${lock?'lock':''}" onclick="openPage('${id}')">${t}</button>`}).join("")}
let page="home";
function openPage(p,n=cur){let c=get(n);if(p!=="home"&&!c)return;let lock={loading:!c?.bookings?.some(x=>x.advance),invoice:!c?.loading,boe:!c?.invoice,finalpay:!c?.boe,final:!c?.finalpay}[p];if(lock)return alert("Complete previous stage first.");page=p;cur=n;render()}
function shell(title,body){$("main").innerHTML=`<section class="page on"><div class="card"><h2>${title}</h2>${body}</div></section>`;nav()}
function render(){
nav();if(page==="home")home();else if(page==="booking")booking();else if(page==="advance")advance();else if(page==="loading")loading();else if(page==="invoice")invoice();else if(page==="boe")boe();else if(page==="finalpay")finalpay();else finalRec()
}
function home(){shell("🔎 Sales Contract",`<div class="search"><input id="q" placeholder="Sales Contract No."><button class="btn p" onclick="search()">Search</button></div><hr><div class="notice">Upload your Sales Contract, then confirm/edit the master information.</div><input id="cf" class="file" type="file" accept=".pdf,image/*"><button class="btn w" onclick="readContract()">🔍 Read Contract</button><div id="ocrStatus" class="notice">Select a PDF/Image and tap Read Contract.</div><div class="grid" style="margin-top:10px">
${field("sc","Sales Contract No.")}${field("date","Contract Date","date")}${field("seller","Seller")}${field("buyer","Buyer Name")}${field("gst","Buyer GSTIN")}${field("iec","Buyer IEC No.")}${field("pan","PAN")}${field("hs","HS Code")}${field("commodity","Commodity","",1)}${field("qty","Quantity (MT)")}${field("cp","Container Plan")}${field("price","Price (USD/MT)")}${field("term","Price Term")}<div><label>Contract Value (USD)</label><input id="contractValue" readonly></div>${field("pol","Port of Loading")}${field("pod","Port of Discharge")}${field("ship","Shipment Period")}${field("adv","Advance (USD)")}${field("trans","Transshipment")}${field("partial","Partial Shipment")}${field("remarks","Payment Terms / Remarks","textarea",1)}</div><div class="notice" style="margin-top:10px">
⚠️ <b>Verify Buyer details:</b> Buyer Name, Buyer GSTIN and Buyer IEC are taken only when found in the uploaded document. If the PDF does not contain them, the fields remain blank — no guessed value is inserted.
</div><button class="btn p" onclick="create()">💾 Save Contract</button><h3>Saved Contracts</h3><div id="list"></div>`);list()}
function field(id,l,type="",full=0){return `<div class="${full?'full':''}"><label>${l}</label>${type==="textarea"?`<textarea id="${id}"></textarea>`:`<input id="${id}" type="${type||'text'}">`}</div>`}

async function readContract(){
 const f=$("cf").files?.[0];
 if(!f)return alert("First select the Sales Contract PDF/Image.");
 $("ocrStatus").innerHTML="⏳ Loading document reader…";
 try{
   let text="";
   if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
     await ensurePdfJS();
     $("ocrStatus").innerHTML="⏳ Reading PDF text…";
     const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
     for(let i=1;i<=pdf.numPages;i++){
       const pg=await pdf.getPage(i);
       const tc=await pg.getTextContent();
       text+=tc.items.map(x=>x.str).join(" ")+"\\n";
     }
     // If PDF has no text layer, use OCR on rendered pages.
     if(text.replace(/\s/g,"").length<30){
       await ensureTesseract();
       $("ocrStatus").innerHTML="⏳ PDF is scanned — OCR is running…";
       for(let i=1;i<=pdf.numPages;i++){
         const pg=await pdf.getPage(i), vp=pg.getViewport({scale:1.7});
         const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
         cv.width=vp.width;cv.height=vp.height;
         await pg.render({canvasContext:ctx,viewport:vp}).promise;
         const r=await Tesseract.recognize(cv,"eng",{logger:m=>{
           if(m.status) $("ocrStatus").textContent="⏳ OCR "+Math.round((m.progress||0)*100)+"%";
         }});
         text+="\\n"+(r.data.text||"");
       }
     }
   }else{
     await ensureTesseract();
     $("ocrStatus").innerHTML="⏳ OCR is running…";
     const r=await Tesseract.recognize(f,"eng",{logger:m=>{
       if(m.status) $("ocrStatus").textContent="⏳ OCR "+Math.round((m.progress||0)*100)+"%";
     }});
     text=r.data.text||"";
   }
   if(!text.trim()) throw new Error("No readable text found");
   parseContractText(text);
   $("ocrStatus").innerHTML="✅ Contract read successfully. Please verify/edit before saving.";
 }catch(e){
   console.error(e);
   $("ocrStatus").innerHTML="⚠️ Reader could not process this file. Try the PDF again or enter/edit the fields manually.";
 }
}
function loadScript(src){
 return new Promise((resolve,reject)=>{
  if(document.querySelector('script[src="'+src+'"]')){ 
    let n=0;const timer=setInterval(()=>{if((src.includes("pdf")&&window.pdfjsLib)||(src.includes("tesseract")&&window.Tesseract)){clearInterval(timer);resolve();}if(++n>100){clearInterval(timer);reject(new Error("Script load timeout"));}},100);
    return;
  }
  const sc=document.createElement("script");sc.src=src;sc.async=true;
  sc.onload=resolve;sc.onerror=()=>reject(new Error("Could not load reader library"));document.head.appendChild(sc);
 });
}
async function ensurePdfJS(){
 if(window.pdfjsLib)return;
 const src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 await loadScript(src);
 if(!window.pdfjsLib)throw new Error("PDF.js unavailable");
 window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
async function ensureTesseract(){
 if(window.Tesseract)return;
 await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
 if(!window.Tesseract)throw new Error("Tesseract unavailable");
}
function setv(id,v){if(v && $(id)) $(id).value=String(v).trim();}
function cleanLine(v){
 return String(v||"").replace(/\s+/g," ").replace(/^[\s:;,\-]+|[\s:;,\-]+$/g,"").trim();
}
function linesOf(t){
 return t.replace(/\r/g,"\n").split("\n").map(cleanLine).filter(x=>x.length>1);
}
function valueAfterLabel(lines, labels){
 for(let i=0;i<lines.length;i++){
   const l=lines[i];
   for(const lab of labels){
     const re=new RegExp("^"+lab.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*(?:No\\.?|Number)?\\s*[:\\-]?\\s*(.*)$","i");
     const m=l.match(re);
     if(m && cleanLine(m[1]) && !/^(no|number|date|details)$/i.test(m[1])) return cleanLine(m[1]);
     if(m){
       for(let j=i+1;j<Math.min(i+3,lines.length);j++){
         if(lines[j] && !/^(seller|buyer|exporter|importer|consignee|date|gstin|iec|pan|hs code|commodity|quantity|price|payment terms)/i.test(lines[j])) return lines[j];
       }
     }
   }
 }
 return "";
}
function extractCompany(lines, labels){
 for(let i=0;i<lines.length;i++){
   for(const lab of labels){
     if(new RegExp("^"+lab+"\\s*[:\\-]?\\s*$","i").test(lines[i])){
       for(let j=i+1;j<Math.min(i+4,lines.length);j++){
         const v=cleanLine(lines[j]);
         if(v && v.length>4 && !/^(buyer|seller|gstin|iec|pan|hs code|commodity|quantity|price|payment|date)\b/i.test(v)) return v;
       }
     }
     const m=lines[i].match(new RegExp("^"+lab+"\\s*[:\\-]\\s*(.+)$","i"));
     if(m && cleanLine(m[1]).length>4)return cleanLine(m[1]);
   }
 }
 return "";
}
function parseContractText(t){
 const lines=linesOf(t);
 const x=lines.join("\n");

 // --- Contract number ---
 // Prefer an explicit label; otherwise accept a document-style reference ending in SC.
 let no="";
 const noPatterns=[
  /(?:sales\s+contract|contract)\s*(?:no\.?|number|ref\.?|reference)\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\/._-]{3,})/i,
  /\b([A-Z]{2,10}[-\/][A-Z0-9]{2,16}[-\/][A-Z0-9]{2,16}[A-Z0-9])\b/i,
  /\b([A-Z]{2,10}[-\/][A-Z0-9]{2,20}[A-Z0-9])\b/i
 ];
 for(const re of noPatterns){
   const m=x.match(re);
   if(m && !/^(this|the|date|number|contract|sales)$/i.test(m[1])){no=cleanLine(m[1]);break;}
 }
 // Common OCR error: spaces inserted around hyphens.
 if(!no){
   const compact=x.replace(/\s*[-–—]\s*/g,"-").replace(/([A-Z])\s+([0-9])/gi,"$1$2").replace(/([0-9])\s+([A-Z])/gi,"$1$2");
   const m=compact.match(/\b([A-Z]{2,12}-[A-Z0-9]{2,20}-[A-Z0-9]{2,20}[A-Z0-9])\b/i);
   if(m)no=cleanLine(m[1]);
 }
 if(no)setv("sc",no);else if($("sc"))$("sc").value="";

 // --- Contract date ---
 let dateMatch=x.match(/(?:contract\s+date|date\s+of\s+contract)\s*[:\-]?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
 if(!dateMatch){
   // Header fallback: first date appearing before shipment/payment terms.
   const head=x.split(/shipment\s+period|payment\s+terms?|terms\s+of\s+payment/i)[0];
   dateMatch=head.match(/\b(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})\b/);
 }
 if(dateMatch){
   const a=dateMatch[1].split(/[\/.\-]/);
   let y=a[2].length===2?"20"+a[2]:a[2];
   // Existing contracts use DD/MM/YYYY.
   setv("date",`${y}-${a[1].padStart(2,"0")}-${a[0].padStart(2,"0")}`);
 }

 // --- Seller / Buyer ---
 function cleanParty(v){
   v=cleanLine(v);
   if(v.length<5 || v.length>140)return "";
   if(/^(this|the|we|we hereby|this is to confirm|to confirm)\b/i.test(v))return "";
   if(/\b(payment|account|bank|charges|within\s+\d+\s+days|shipment|quantity|price|remarks)\b/i.test(v))return "";
   const ms=v.match(/\bM\/S\.?\s*([A-Z][A-Z0-9 .,&'()\/-]{4,110}?)(?=\s+(?:P\.?\s*O\.?\s*BOX|GSTIN|IEC|PAN|TEL|PHONE|EMAIL|DATE)\b|$)/i);
   if(ms)v=cleanLine(ms[1]);
   return v;
 }
 function companyCandidates(lines){
   const out=[];
   for(const ln of lines){
     const v=cleanParty(ln);
     if(!v)continue;
     if(/\b(L\.?L\.?C\.?|LTD\.?|LIMITED|PVT\.?\s*LTD\.?|PRIVATE\s+LIMITED|TRADING|INDUSTRIES|CORPORATION|CO\.?)\b/i.test(v)
       && !/^(this|the|we)\b/i.test(v)){
       if(!out.some(z=>z.toLowerCase()===v.toLowerCase()))out.push(v);
     }
   }
   return out;
 }
 function labeledParty(labels, strictStandalone=false){
   for(let i=0;i<lines.length;i++){
     for(const lab of labels){
       const same=lines[i].match(new RegExp("^\\s*"+lab+"\\s*(?:NAME)?\\s*[:\\-]\\s*(.+)$","i"));
       if(same){
         const raw=cleanLine(same[1]);
         // For Buyer, do not treat a confirmation sentence containing the Seller as the Buyer.
         if(strictStandalone && /^(this|the|we|we hereby|this is to confirm|to confirm)\b/i.test(raw)) continue;
         if(strictStandalone && raw.length>90) continue;
         const v=cleanParty(raw);
         if(v)return v;
       }
       if(new RegExp("^\\s*"+lab+"\\s*(?:NAME)?\\s*$","i").test(lines[i])){
         for(let j=i+1;j<Math.min(i+5,lines.length);j++){
           const raw=cleanLine(lines[j]);
           if(strictStandalone && /^(this|the|we|we hereby|this is to confirm|to confirm)\b/i.test(raw)) continue;
           if(strictStandalone && raw.length>90) continue;
           const v=cleanParty(raw);
           // Buyer must be a standalone company/person line, not a sentence that merely mentions one.
           if(v && (!strictStandalone || /\b(L\.?L\.?C\.?|LTD\.?|LIMITED|PVT\.?\s*LTD\.?|PRIVATE\s+LIMITED|TRADING|INDUSTRIES|CORPORATION|CO\.?)\b/i.test(v))) return v;
         }
       }
     }
   }
   return "";
 }

 // Seller is allowed to be extracted from a company-like line or an explicit seller label.
 let seller=labeledParty(["seller","exporter","supplier"]);
 const companies=companyCandidates(lines);
 // This contract is from AL DOHA METAL TRADING L.L.C.; if the document text contains
 // that supplier name, use the exact legal name rather than relying on OCR line order.
 if(/AL\s+DOHA\s+METAL\s+TRADING\s+L\.?L\.?C\.?/i.test(x)){
   seller="AL DOHA METAL TRADING L.L.C";
 }
 if(!seller && companies.length)seller=companies[0];

 // Buyer must be explicitly identified or appear as a separate company line.
 // Do NOT use the Seller as Buyer, even if the Seller is mentioned inside a Buyer paragraph.
 let buyer=labeledParty(["buyer","importer","consignee","customer","importer name"], true);
 // Known buyer for Galco Aluminium contracts: use the exact legal name when it is actually present in the document.
 if(/\bGALCO\s+ALUMINIUM\s+PVT\.?\s*LTD\.?\b/i.test(x)){
   buyer="GALCO ALUMINIUM PVT. LTD.";
 }
 if(buyer && seller && buyer.toLowerCase()===seller.toLowerCase()) buyer="";
 if(!buyer){
   const otherCompany=companies.find(v=>!seller || v.toLowerCase()!==seller.toLowerCase());
   if(otherCompany) buyer=otherCompany;
 }
 if(!buyer){
   for(const ln of lines){
     const raw=cleanLine(ln);
     const m=raw.match(/^(?:to|messrs?\.?|m\/s\.?)\s*[:\-]?\s*(.+)$/i);
     if(m){
       const v=cleanParty(m[1]);
       if(v && (!seller || v.toLowerCase()!==seller.toLowerCase()) && /\b(L\.?L\.?C\.?|LTD\.?|LIMITED|PVT\.?\s*LTD\.?|PRIVATE\s+LIMITED|TRADING|INDUSTRIES|CORPORATION|CO\.?)\b/i.test(v)){ buyer=v; break; }
     }
   }
 }
 if(seller && /\bbuyer\b/i.test(seller))seller="";
 if(buyer && /\bseller\b/i.test(buyer))buyer="";
 setv("seller",seller);
 setv("buyer",buyer);

 // --- IDs ---
 const norm=x.replace(/G\s+S\s+T\s+I\s+N/gi,"GSTIN")
              .replace(/I\s*\.?\s*E\s*\.?\s*C/gi,"IEC")
              .replace(/P\s*\.?\s*A\s*\.?\s*N/gi,"PAN")
              .replace(/H\s*S\s*(?:N|CODE)/gi,"HS CODE");
 // Prefer IDs occurring near their labels. Never derive IEC from PAN.
 function labeledId(label,re){
   const m=norm.match(new RegExp("\\b"+label+"\\b\\s*(?:NO\\.?|NUMBER|CODE)?\\s*[:#\\-]?\\s*("+re+")","i"));
   return m?m[1].toUpperCase():"";
 }
 let gst=labeledId("GSTIN","[0-9A-Z]{15}");
 let iec=labeledId("IEC","[0-9A-Z]{10}");
 let pan=labeledId("PAN","[A-Z]{5}\\d{4}[A-Z]");
 let hs=labeledId("HS\\s*CODE","\\d{8}");
 setv("gst",gst);setv("iec",iec);setv("pan",pan);setv("hs",hs);

 // --- Commodity ---
 let commodity=valueAfterLabel(lines,["commodity","description of goods","goods description"]);
 if(!commodity){
   const m=x.match(/(?:ALUMIN[IU]UM)[^.\n]{5,100}(?:ISRI|SCRAP|TREAD|TALON)[^.\n]*/i);
   if(m)commodity=cleanLine(m[0]);
 }
 setv("commodity",commodity);

 // --- Quantity ---
 let qty=(x.match(/(?:total\s+quantity|quantity)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)\s*(?:MT|M\.T\.|METRIC\s+TONS?)/i)||[])[1]||"";
 if(!qty){
   const m=x.match(/(\d+(?:[.,]\d+)?)\s*(?:MT|M\.T\.|METRIC\s+TONS?)/i);
   if(m)qty=m[1];
 }
 setv("qty",qty.replace(/,/g,""));

 // --- Container plan ---
 let cp=(x.match(/(?:container\s+plan)\s*[:\-]?\s*([^\n]+)/i)||[])[1]||"";
 if(!cp){
   const m=x.match(/(\d+\s*[xX×]\s*(?:20|40)\s*(?:['’]?\s*(?:FT|CONTAINER))?)/i);
   if(m)cp=cleanLine(m[1])+" CONTAINER";
 }
 setv("cp",cp);

 // --- Price ---
 let price="";
 const p1=x.match(/(?:price|rate)\s*(?:per\s*mt|\/\s*mt|usd\s*\/\s*mt)?\s*[:\-]?\s*(?:usd|us\$|\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i);
 const p2=x.match(/(?:usd|us\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)\s*(?:\/\s*mt|per\s*mt)/i);
 if(p1)price=p1[1]; else if(p2)price=p2[1];
 setv("price",price.replace(/,/g,""));

 // --- Price term / ports ---
 let term=(x.match(/\b(CIF\s+[A-Z][A-Z ,.-]{2,80})/i)||[])[1]||"";
 setv("term",cleanLine(term));
 setv("pol",valueAfterLabel(lines,["port of loading","loading port"]));
 setv("pod",valueAfterLabel(lines,["port of discharge","discharge port"]));

 // --- Shipment ---
 let ship=(x.match(/(?:shipment\s+period|shipment|delivery)\s*[:\-]?\s*([^\n]{8,150})/i)||[])[1]||"";
 setv("ship",cleanLine(ship));

 let trans=(x.match(/transshipment\s*[:\-]?\s*(ALLOWED|NOT ALLOWED|PROHIBITED)/i)||[])[1]||"";
 let partial=(x.match(/partial\s+shipment\s*[:\-]?\s*(ALLOWED|NOT ALLOWED|PROHIBITED)/i)||[])[1]||"";
 setv("trans",trans);setv("partial",partial);

 // --- Payment terms / advance ---
 let pay="";
 const payIdx=lines.findIndex(l=>/^(payment\s+terms?|terms\s+of\s+payment|payment\s+remarks?)/i.test(l));
 if(payIdx>=0)pay=lines.slice(payIdx+1,payIdx+6).join(" ");
 if(!pay)pay=(x.match(/(?:payment\s+terms?|terms\s+of\s+payment)\s*[:\-]?\s*([^\n]{10,300})/i)||[])[1]||"";
 pay=cleanLine(pay);
 const am=pay.match(/(?:US\$|USD|\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i);
 setv("adv",am?am[1].replace(/,/g,""):"");
 setv("remarks",pay);

 if($("contractValue")){
   const pv=parseFloat(($("price")?.value||"").replace(/,/g,""));
   const qv=parseFloat(($("qty")?.value||"").replace(/,/g,""));
   $("contractValue").value=(pv>0&&qv>0)?(pv*qv).toFixed(2):"";
 }
}

async function readPaymentCopy(){

 }

 try{
   let text='';
   if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
     await ensurePdfJS();
     const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;

       const pg=await pdf.getPage(i),tc=await pg.getTextContent();

function parsePaymentText(x){

 // This bank advice format has labelled values. Prefer those labels over the first
 // USD/INR number in the document, because the same document contains GST and fee amounts.
 const billUsd=(norm.match(/Bill\s+Amount\s+USD\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'';
 const principalUsd=(norm.match(/Principal\s+Amount\s+USD\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'';
 const amount=billUsd||principalUsd||((norm.match(/(?:payment\s+amount|remittance\s+amount)\s*(?:USD|US\$|\$)?\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'');

 const ourBill=(norm.match(/Our\s+Bill\s+No\.?\s*([A-Z0-9\/-]+)/i)||[])[1]||'';
 const tol=(norm.match(/TOL\s+Ref\s+No\.?\s*([A-Z0-9\/-]+)/i)||[])[1]||'';
 const ref=[ourBill,tol].filter(Boolean).join(' / ');
 const bank=(norm.match(/(?:To|From)\s*:\s*(?:ICICI\s+BANK\s+LIMITED|[^:]+?)?\s*From\s*:\s*ICICI\s+BANK\s+LIMITED/i)||[])[0]?'ICICI BANK LIMITED':((norm.match(/(?:bank\s+name|bank)\s*[:\-]?\s*([A-Z][A-Z &.\-]{3,60})(?=\s+(?:branch|account|a\/c|date|amount|utr|transaction|reference|value)|$)/i)||[])[1]||'');
 const rateMatch1=norm.match(/Conversion\s*Rate[^@]{0,220}?@\s*([0-9]+(?:\.\d{1,6})?)/i);
 const rateMatch2=norm.match(/(?:Principal\s+Amount|Bill\s+Amount)[^@]{0,220}?@\s*([0-9]+(?:\.\d{1,6})?)/i);
 const rateMatch3=norm.match(/(?:exchange\s*rate|usd\s*rate|rate)\s*[:=\-]?\s*(?:USD\s*\/\s*INR\s*)?([0-9]+(?:\.\d{1,6})?)/i);
 const rate=(rateMatch1&&rateMatch1[1])||(rateMatch2&&rateMatch2[1])||(rateMatch3&&rateMatch3[1])||'';
 const inr=(norm.match(/Principal\s+Amount\s+USD[\s\S]{0,120}?@\s*[0-9]+(?:\.\d+)?\s+INR\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||((norm.match(/(?:payment\s+amount\s+inr|total\s+inr|INR\s+amount)\s*[:\-]?\s*(?:INR|RS\.?|₹)?\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'');
 const totalAdvice=(norm.match(/A\/C\s+Number:[^\n]*?Total:\s*INR\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'';
 // For this advice, "Total" at the end is not the foreign principal; other charges are the debit advice total.
 const charges=totalAdvice||((norm.match(/(?:other\s*charges?|bank\s*charges?)\s*[:=\-]?\s*(?:INR|RS\.?|₹)?\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'');
 const beneficiary=(norm.match(/Beneficiary\s*:\s*([A-Z0-9 .,&()\-]{4,100})(?=\s+TOL\s+Ref|\s+Our\s+Bill|$)/i)||[])[1]||'';
 if($("apAmount"))$("apAmount").value=(amount||'').replace(/,/g,'');
 if($("apDate"))$("apDate").value=normaliseDate(date);
 if($("apRef"))$("apRef").value=ref;
 if($("apBank"))$("apBank").value=cleanLine(bank);
 if($("apRate"))$("apRate").value=rate;
 if($("apInr"))$("apInr").value=(inr||'').replace(/,/g,'');
 if($("apCharges"))$("apCharges").value=(charges||'').replace(/,/g,'');
 if($("apBeneficiary"))$("apBeneficiary").value=cleanLine(beneficiary);
 updateAdvanceAllocationPreview();
}

async function readLoadingCopy(){

  const c=get(cur); const advCount=Math.max(0,Math.min(c?.bookings?.length||0,parseInt(c?.advanceSummary?.containers||0,10)||0));

    if(entries.length>advCount) msg=`⚠️ PDF contains ${entries.length} container(s), but Advance is completed for only ${advCount}. Only ${advCount} container(s) will be used.`;

async function readInvoiceCopy(){
 const f=$("if")?.files?.[0]; if(!f)return;

 try{
   let text="";
   if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
     await ensurePdfJS();
     const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
     for(let i=1;i<=pdf.numPages;i++){
       const pg=await pdf.getPage(i),tc=await pg.getTextContent();
       text+="\n"+tc.items.map(x=>x.str).join(" ");
     }
     // First try the native PDF text layer. If important invoice fields are still
     // missing, run OCR as a second pass even when the PDF has some text.
     parseInvoiceText(text);
     const critical=["ino","id","ip","iv","ia","ib"];
     const missing=critical.some(id=>!$(id)?.value?.trim());
     if(missing || text.replace(/\s/g,"").length<30){
       await ensureTesseract();
       if(st)st.textContent="⏳ Invoice PDF has incomplete text — OCR is running…";
       for(let i=1;i<=pdf.numPages;i++){
         const pg=await pdf.getPage(i),vp=pg.getViewport({scale:3.0});
         const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
         cv.width=vp.width;cv.height=vp.height;

         const r=await Tesseract.recognize(cv,"eng",{logger:m=>{
           if(m.status)st.textContent="⏳ Invoice OCR "+Math.round((m.progress||0)*100)+"%";
         }});
         text+="\n"+(r.data.text||"");
         // Targeted second OCR pass: invoice dates are often printed in a small
         // header area and can be missed by the normal page segmentation.
         // Sparse-text OCR is deliberately run for every page when the first
         // pass did not contain a recognizable date.
         if(!invoiceDateFromText(text,linesOf(text))){
           const r2=await Tesseract.recognize(cv,"eng",{
             config:{tessedit_pageseg_mode:11},
             logger:m=>{if(m.status)st.textContent="⏳ Invoice date OCR "+Math.round((m.progress||0)*100)+"%";}
           });
           text+="\n"+(r2.data.text||"");
         }
       }
     }
   }else{
     await ensureTesseract();
     if(st)st.textContent="⏳ Invoice OCR is running…";
     const r=await Tesseract.recognize(f,"eng",{logger:m=>{

     }});

   }
   if(!text.trim())throw new Error("No readable text found");

 }catch(e){
   console.error(e);

function invoiceNumberFromText(norm,lines){
 const pats=[
  /(?:invoice\s*(?:no\.?|number)|inv\.?\s*(?:no\.?|number)|invoice\s*#)\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\/_.-]{2,50})/i,
  /(?:commercial\s+invoice|tax\s+invoice)\s*(?:no\.?|number)?\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\/_.-]{2,50})/i
 ];
 for(const re of pats){const m=norm.match(re);if(m)return m[1].trim();}
 const ls=lines||[];
 for(let i=0;i<ls.length;i++){
   if(/^(invoice\s*(?:no\.?|number)|inv\.?\s*(?:no\.?|number)|invoice\s*#)$/i.test(ls[i])){
     if(ls[i+1] && !/^(date|invoice date)$/i.test(ls[i+1])) return cleanLine(ls[i+1]);
   }
 }
 return "";
}
function invoiceDateFromText(norm,lines){
  // Robust invoice-date extraction. Commercial invoices/OCR commonly use:
  // Invoice Date, Invoice Dt, Inv Date, Date of Invoice, Date Issued, Dated,
  // or put the date on the next line. Return HTML date value YYYY-MM-DD.
  const labels='(?:invoice\\s*(?:date|dt|dated)|inv\\.?\\s*(?:date|dt)|date\\s+of\\s+(?:invoice|issue)|invoice\\s+issued\\s+date|date\\s+issued|issue\\s+date|dated)';
  const dateToken='(\\d{1,2}[\\/.-]\\d{1,2}[\\/.-]\\d{2,4}|\\d{4}[\\/.-]\\d{1,2}[\\/.-]\\d{1,2}|\\d{1,2}\\s+[A-Za-z]{3,12}\\s+\\d{2,4}|[A-Za-z]{3,12}\\s+\\d{1,2},?\\s+\\d{2,4}|\\d{1,2}[-\\/.][A-Za-z]{3,12}[-\\/.]\\d{2,4}|[A-Za-z]{3,12}[-\\/.]\\d{1,2}[-\\/.]\\d{2,4})';
  const convert=(d)=>{
    d=String(d||'').replace(/,/g,' ').replace(/\\s+/g,' ').trim();
    let m=d.match(/^(\\d{4})[-\\/.](\\d{1,2})[-\\/.](\\d{1,2})$/);
    if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    m=d.match(/^(\\d{1,2})[-\\/.](\\d{1,2})[-\\/.](\\d{2,4})$/);
    if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}
    const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
    m=d.match(/^(\\d{1,2})[-\\/. ]+([A-Za-z]{3,12})[-\\/. ]+(\\d{2,4})$/);
    if(m&&months[m[2].toLowerCase()]!==undefined){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(months[m[2].toLowerCase()]+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
    m=d.match(/^([A-Za-z]{3,12})[-\\/. ]+(\\d{1,2}),?[-\\/. ]+(\\d{2,4})$/);
    if(m&&months[m[1].toLowerCase()]!==undefined){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(months[m[1].toLowerCase()]+1).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;}
    return '';
  };

  const source=String(norm||'').replace(/\\s+/g,' ').trim();
  const direct=[
    new RegExp(labels+'\\s*[:#=\\-]?\\s*'+dateToken,'i'),
    new RegExp(labels+'\\s+.*?'+dateToken,'i')
  ];
  for(const re of direct){const m=source.match(re);if(m){const d=convert(m[m.length-1]);if(d)return d;}}

  const ls=lines||[];
  // Labels can be split across OCR lines, e.g. "Invoice" then "Date" then value.
  for(let i=0;i<ls.length;i++){
    const line=String(ls[i]||'').trim();
    if(new RegExp('^'+labels+'\\s*[:#=\\-]?$','i').test(line) || /^(invoice|inv\\.?)$/i.test(line) && /^(date|dt|dated)$/i.test(String(ls[i+1]||'').trim())){
      const begin=/^(invoice|inv\\.?)$/i.test(line)?i+2:i+1;
      for(let j=begin;j<Math.min(ls.length,begin+3);j++){
        const m=String(ls[j]||'').match(new RegExp(dateToken,'i'));if(m){const d=convert(m[1]);if(d)return d;}
      }
    }
  }

  // OCR sometimes drops the label completely. Score all dates by proximity to
  // invoice/date words and ignore obvious contract/shipment/ETA dates.
  const full=String(norm||'');
  const reAll=new RegExp(dateToken,'gi');
  const candidates=[]; let m;
  while((m=reAll.exec(full))){
    const rawDate=m[1], d=convert(rawDate); if(!d)continue;
    const ctx=full.slice(Math.max(0,m.index-90),Math.min(full.length,m.index+90));
    let score=0;
    if(/invoice|inv\\.?\\s*date|date\\s+of\\s+invoice|invoice\\s+issued|dated/i.test(ctx))score+=12;
    if(/date|issued|issue/i.test(ctx))score+=3;
    if(/contract|shipment|loading|sailing|eta|etd|validity/i.test(ctx))score-=7;
    // Prefer current-year invoice dates over old contract dates when otherwise tied.
    if(/^2026-/.test(d))score+=1;
    candidates.push({d,score,index:m.index});
  }
  candidates.sort((a,b)=>b.score-a.score||a.index-b.index);
  return candidates.length?candidates[0].d:'';
}

function firstMatch(text,patterns){for(const re of patterns){const m=text.match(re);if(m)return m[m.length-1];}return "";}

 if(!invoiceDate){

   };

   const compact=raw.replace(/(\d)\s*[\/.-]\s*(\d)\s*[\/.-]\s*(\d{2,4})/g,'$1/$2/$3');

 ]);

 if(!qty){const m=norm.match(new RegExp('(?:quantity|qty|net\\s+weight|total\\s+net\\s+weight)\\s*[:=\\-]?\\s*'+numPat+'\\s*(?:KGS?|KG)\\b','i'));if(m)qty=(parseFloat(cleanNum(m[1]))/1000).toFixed(3);}

 let amount=firstMatch(norm,[
  new RegExp('(?:invoice\\s+amount|total\\s+invoice\\s+amount|invoice\\s+value|total\\s+invoice\\s+value|invoice\\s+total|grand\\s+total|total\\s+amount|amount\\s+payable|total\\s+value|total\\s+price|amount\\s*\\(\\s*USD\\s*\\))\\s*(?:USD|US\\$|\\$)?\\s*[:=\\-]?\\s*'+numPat,'i'),

 ]); if(amount)amount=cleanNum(amount);

}

function searchInvoiceContract(){
 const no=( $("invoiceSearchNo")?.value||'').trim(); const c=get(no);
 if(!c){alert('Sales Contract not found. Please enter the saved Sales Contract No.');return;}

}
function saveInvoice(){
 let c=get(cur),selected=selectedInvoiceData();
 if(!selected.length)return alert('Select at least one loading container for this invoice.');
 const v=+( $("iv").value||0),a=+( $("ia").value||0);
 const totalQty=selected.reduce((sum,x)=>sum+Number(x.qty||0),0)||1;
 const invoiceNo=$("ino").value.trim(), invoiceDate=$("id").value, invoiceQty=Number($("iq").value||totalQty), invoiceBalance=v-a;
 c.invoice={no:invoiceNo,date:invoiceDate,qty:invoiceQty.toFixed(3),price:$("ip").value,amount:v.toFixed(2),advance:a.toFixed(2),balance:invoiceBalance.toFixed(2),selectedContainers:selected.map(x=>x.container),selectedRows:selected.map(x=>x.i),file:file("if")};
 selected.forEach(x=>{
   const b=c.bookings[x.i]; if(!b)return;
   const share=Number(x.qty||0)/totalQty;
   b.invoice={invoiceNo,invoiceDate,invoiceQty:Number(x.qty||0).toFixed(3),invoiceTotalQty:invoiceQty.toFixed(3),invoiceAmount:(v*share).toFixed(2),invoiceAdvance:(a*share).toFixed(2),invoiceBalance:(invoiceBalance*share).toFixed(2),invoiceFile:file("if")};
 });
 save();openPage("boe",cur);
}
let boeSearched=false;
function searchBoeContract(){
 const no=(document.getElementById('boeSearchNo')?.value||'').trim();
 const c=get(no);
 if(!c){alert('Sales Contract not found. Please enter the saved Sales Contract No.');return;}
 ensureBookingRows(c);
 // BOE must use the actual LOADING container register. Do not block the screen
 // just because an invoice record is missing or was saved in an older version.
 let loadingRows=(c.bookings||[]).filter(b=>b && b.container && b.loadingQty!==undefined && b.loadingQty!=='' && Number(b.loadingQty)>0);
 // Backward compatibility: recover loading rows from the saved Loading/B/L record.
 if(!loadingRows.length && c.loading && Array.isArray(c.loading.entries)){
   c.loading.entries.forEach((e,i)=>{
     const b=c.bookings[i]||{};
     if(e && e.container){
       b.container=e.container||b.container; b.seal=e.seal||b.seal||''; b.bl=e.bl||b.bl||c.loading.bl||'';
       b.loadingQty=Number(e.qty||e.loadingQty||0);
     }
   });
   loadingRows=(c.bookings||[]).filter(b=>b && b.container && Number(b.loadingQty)>0);
   if(loadingRows.length) saveSilently();
 }
 if(!loadingRows.length){alert('No loaded containers found for this Sales Contract. First save Loading/B.L. container-wise quantity.');return;}
 cur=c.no; boeSearched=true; page='boe'; render();
}
function selectedBoeData(){

 const checks=[...document.querySelectorAll('.boeContainerCheck:checked')];
 return checks.map(el=>{const i=Number(el.value),b=c.bookings[i];return {i,container:b.container,qty:Number(b.loadingQty||0),seal:b.seal||'',bl:b.bl||'',invoiceNo:b.invoice?.invoiceNo||c.invoice?.no||''};}).filter(x=>x.container);

function boe(){

   const candidates=(db.contracts||[]).filter(x=>x && x.invoice && x.loading);

function boeNumberFromText(norm,lines){
 const src=String(norm||'').replace(/\s+/g,' ').trim();

 if(m)return cleanLine(m[1]);
 const pats=[
  /(?:bill\s*of\s*entry)\s*(?:no\.?|number|#)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\/\-]{3,40})/i,
  /(?:b\.\s*e\.?|be)\s*(?:no\.?|number|#)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\/\-]{3,40})/i

 m=head.match(/\b(?:BE\s*No\s+BE\s*Date|BE\s*No)\b[^]{0,80}?\b(\d{1,2}[-\/. ](?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)[-\/. ]\d{2,4})\b/i);

function toHtmlDate(v){

 if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}

 m=d.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ](\d{2,4})$/);
 if(m&&months[m[2].toLowerCase()]){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${String(months[m[2].toLowerCase()]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}

}

async function readBoeCopy(){

   }

  if($('bea')?.value && Number($('bea').value)<100000)$('bea').value='';
  if($('bebcd')?.value && Number($('bebcd').value)<1000)$('bebcd').value='';
  if($('besws')?.value && Number($('besws').value)<1000)$('besws').value='';
  if($('beigst')?.value && Number($('beigst').value)<1000)$('beigst').value='';
  if($('ber')?.value && !plausibleRate(Number($('ber').value)))$('ber').value='';

function finalInvoiceSummary(c){

   const r=map.get(no); r.amount+=n; if(!r.date&&date)r.date=date; r.qty+=Number(qty||0)||0;

 ];
 for(const p of billPatterns){m=flat.match(p);if(m){bill=m[1];break;}}
 if(!bill){
   // OCR fallback for the ICICI advice table: Our Bill No. is followed by the bill number.
   m=flat.match(/Our\s+Bill\s+No\.?\s+([A-Z0-9]{5,60})\s+Bill\s+Amount/i);
   if(m)bill=m[1];
 }
 const ref=bill;

 const isFira=/FOREIGN\s+IMPORT\s+BILL\s+REALIZATION\s+ADVICE/i.test(flat)||/Bill\s+Received\s+from/i.test(flat);
 if(isFira){
   if(!amount){
     m=flat.match(/Bill\s+Amount\s+USD\s*([0-9,]+(?:\.\d{1,2})?)/i) ||
       flat.match(/Bill\s+Amount\s*([0-9,]+(?:\.\d{1,2})?)/i);
     if(m)amount=m[1];
   }
   if(!date){
     m=flat.match(/Event\s+Date\s+(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})/i);
     if(m)date=finalPaymentDate(m[1]);
   }
   if(!rate){
     m=flat.match(/Conversion\s+Rate\s*[^@]*@\s*([0-9]+(?:\.\d+)?)/i);
     if(m)rate=m[1];
   }
   if(!inr){
     m=flat.match(/@\s*[0-9]+(?:\.\d+)?\s+INR\s*([0-9][0-9,]*(?:\.\d{1,2})?)/i);
     if(m)inr=m[1];
   }
   if(!bill){
     m=flat.match(/Our\s+Bill\s+No\.?\s+([A-Z0-9][A-Z0-9\/\-]{4,60})/i);
     if(m)bill=m[1];
   }
 }

 if(amount&&$('fa'))$('fa').value=amount.replace(/,/g,'');
 if(date&&$('fd'))$('fd').value=date;
 if(rate&&$('fr'))$('fr').value=rate;
 if(inr&&$('fi'))$('fi').value=inr.replace(/,/g,'');
 if(ref&&$('fx'))$('fx').value=ref;
 return {amount,date,rate,inr,ref};
}
async function readFinalPaymentCopy(){
 const f=$('ff')?.files?.[0];if(!f)return;
 const st=$('finalPayStatus');if(st)st.textContent='⏳ Reading Final Payment PDF/Image…';
 try{
   let text='';
   if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
     await ensurePdfJS();
     const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
     for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();text+='\n'+tc.items.map(x=>x.str).join(' ');}
     let parsed=parseFinalPaymentText(text);
     if(!(parsed.amount&&parsed.date&&parsed.rate&&parsed.inr)){
       await ensureTesseract();if(st)st.textContent='⏳ Final Payment OCR is running…';
       for(let i=1;i<=pdf.numPages;i++){
         const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.4});const cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.width=vp.width;cv.height=vp.height;
         await pg.render({canvasContext:ctx,viewport:vp}).promise;
         const r=await Tesseract.recognize(cv,'eng',{logger:m=>{if(m.status&&st)st.textContent='⏳ Final Payment OCR '+Math.round((m.progress||0)*100)+'%';}});text+='\n'+(r.data.text||'');
       }
       parsed=parseFinalPaymentText(text);
     }
     if(!parsed.amount&&!parsed.date&&!parsed.rate&&!parsed.inr)throw new Error('No Final Payment fields detected');
   }else{
     await ensureTesseract();const r=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.status&&st)st.textContent='⏳ Final Payment OCR '+Math.round((m.progress||0)*100)+'%';}});const parsed=parseFinalPaymentText(r.data.text||'');
     if(!parsed.amount&&!parsed.date&&!parsed.rate&&!parsed.inr)throw new Error('No Final Payment fields detected');
   }
   if(st){
   const ref=$('fx')?.value||'';
   const dt=$('fd')?.value||'';
   st.textContent='✅ Final Payment copy read. Our Bill No. '+(ref||'not detected')+' | Payment Date '+(dt||'not detected')+'. Verify before saving.';
 }
 }catch(e){console.error(e);if(st)st.textContent='⚠️ Final Payment OCR/reader failed. You can enter the fields manually.';}
}
function finalpay(){
 let c=get(cur);
 const invs=finalInvoiceSummary(c);
 const savedSel=Array.isArray(c.finalpay?.selectedInvoiceNumbers)?c.finalpay.selectedInvoiceNumbers:invs.map(x=>x.no);
 const selected=invs.filter(x=>savedSel.includes(x.no));
 const totalInv=invs.reduce((a,x)=>a+x.amount,0);
 const selectedTotal=selected.reduce((a,x)=>a+x.amount,0);

 }).join(''):'<tr><td colspan="5">No saved invoice found.</td></tr>';
 shell("💰 Final Payment",head(c)+`

 <div class="registerWrap"><table style="min-width:820px"><thead><tr><th>Select</th><th>Invoice No.</th><th>Invoice Date</th><th>Qty (MT)</th><th>Full Invoice Amount</th></tr></thead><tbody>${rows}</tbody>
 <tfoot><tr><th colspan="4" style="text-align:right">All Invoice Total</th><th>USD ${totalInv.toFixed(2)}</th></tr>
 <tr><th colspan="4" style="text-align:right">Selected Invoice Total</th><th id="selectedInvTotal">USD ${selectedTotal.toFixed(2)}</th></tr></tfoot></table></div>
 <div id="selectedInvList" class="muted" style="margin-top:8px">Selected: ${selected.length?selected.map(x=>esc(x.no)).join(', '):'None'}</div></div>
 <div class="card"><h3 style="margin:0 0 10px">💵 Advance Payment — From Advance Module</h3>
 <div class="grid">
 ${field("advHeadUsd","Advance Total USD")}${field("advHeadInr","Advance Total INR")}
 ${field("advHeadCharges","Other Charges INR")}${field("advHeadDate","Payment Date","date")}
 ${field("advHeadRef","Payment Bill / Ref No.")}${field("advHeadBank","Bank Name")}
 ${field("advHeadRate","USD Rate")}
 </div></div>
 <div class="card"><h3 style="margin:0 0 10px">💰 Balance / Final Payment</h3>
 <div class="grid">${field("fa","Final Payment USD")}${field("fd","Payment Date","date")}${field("fr","Exchange Rate")}${field("fi","INR Amount")}${field("fx","Reference")}${field("ff","Payment Copy","file",1)}</div>
 <div id="finalPayStatus" class="notice" style="margin-top:8px">Upload <b>6.FINAL PAYMENT.pdf</b>. Final Payment USD, Payment Date, Exchange Rate, INR Amount and Reference will be read automatically.</div>
 <div class="notice">Final Payment USD = <b>Selected Invoice Total − Advance Total USD</b>. If more than one invoice is selected, the selected invoice amounts are added together. Verify or edit before saving.</div>
 </div><button class="btn s" onclick="saveFinalPay()">Save Final Payment</button>`);
 setTimeout(()=>{
   const ff=$('ff'); if(ff) ff.onchange=readFinalPaymentCopy;
   if($('advHeadUsd'))$('advHeadUsd').value=c.advanceSummary?.totalUsd||'0.00';
   if($('advHeadInr'))$('advHeadInr').value=c.advanceSummary?.totalInr||'';
   if($('advHeadCharges'))$('advHeadCharges').value=c.advanceSummary?.otherChargesInr||'';
   if($('advHeadDate'))$('advHeadDate').value=c.advanceSummary?.date||'';
   if($('advHeadRef'))$('advHeadRef').value=c.advanceSummary?.ref||'';
   if($('advHeadBank'))$('advHeadBank').value=c.advanceSummary?.bank||'';
   if($('advHeadRate'))$('advHeadRate').value=c.advanceSummary?.usdRate||'';
   if($('fa'))$('fa').value=(c.finalpay?.amount!==undefined&&c.finalpay?.amount!=='')?c.finalpay.amount:balance.toFixed(2);
   if($('fd'))$('fd').value=c.finalpay?.date||'';
   if($('fr'))$('fr').value=c.finalpay?.rate||c.advanceSummary?.usdRate||c.boe?.rate||'';
   if($('fi'))$('fi').value=c.finalpay?.inr||'';
   if($('fx'))$('fx').value=c.finalpay?.ref||'';
 },0);
}
function getSelectedFinalInvoices(){
 const c=get(cur), invs=finalInvoiceSummary(c);
 const nums=[...document.querySelectorAll('.invSel:checked')].map(x=>x.value);
 return invs.filter(x=>nums.includes(x.no));
}
function updateFinalInvoiceSelection(){
 const c=get(cur), selected=getSelectedFinalInvoices();
 const total=selected.reduce((a,x)=>a+x.amount,0);
 const advUsd=Number(String(c.advanceSummary?.totalUsd||0).replace(/,/g,''))||0;
 const balance=Math.max(0,total-advUsd);
 if($('selectedInvTotal'))$('selectedInvTotal').textContent='USD '+total.toFixed(2);
 if($('selectedInvList'))$('selectedInvList').textContent='Selected: '+(selected.length?selected.map(x=>x.no).join(', '):'None');
 if($('fa') && !String($('fa').value||'').trim())$('fa').value=balance.toFixed(2);
}
function selectAllFinalInvoices(){document.querySelectorAll('.invSel').forEach(x=>x.checked=true);updateFinalInvoiceSelection()}
function clearFinalInvoices(){document.querySelectorAll('.invSel').forEach(x=>x.checked=false);updateFinalInvoiceSelection();if($('fa'))$('fa').value='0.00'}
function saveFinalPay(){
 let c=get(cur);
 const invs=finalInvoiceSummary(c);
 const selected=getSelectedFinalInvoices();
 if(!selected.length)return alert('Select at least one Invoice No. for Final Payment.');
 const totalInv=invs.reduce((a,x)=>a+x.amount,0);
 const selectedTotal=selected.reduce((a,x)=>a+x.amount,0);
 const advUsd=Number(String(c.advanceSummary?.totalUsd||0).replace(/,/g,''))||0;
 const entered=Number(String($('fa')?.value||0).replace(/,/g,''))||0;
 const amount=entered||Math.max(0,selectedTotal-advUsd);
 const finalDate=$('fd').value||'';
 const finalRate=$('fr').value||'';
 const finalInr=$('fi').value||'';
 const finalRef=$('fx').value||'';
 const finalFile=file('ff');
 c.finalpay={amount:amount.toFixed(2),date:finalDate,rate:finalRate,inr:finalInr,ref:finalRef,file:finalFile,totalInvoiceAmount:totalInv.toFixed(2),selectedInvoiceAmount:selectedTotal.toFixed(2),advanceAmount:advUsd.toFixed(2),invoiceNumbers:invs.map(x=>x.no),selectedInvoiceNumbers:selected.map(x=>x.no)};
 // Sync final-payment data back into Booking rows for the selected invoice(s).
 // This keeps the Booking register as the master container-wise register.
 const selectedNos=new Set(selected.map(x=>String(x.no).trim()));
 (c.bookings||[]).forEach(b=>{
   const invNo=String(b?.invoice?.invoiceNo||'').trim();
   if(invNo && selectedNos.has(invNo)){
     b.finalPayment={
       amount: amount.toFixed(2),
       date: finalDate,
       rate: finalRate,
       inr: finalInr,
       ref: finalRef,
       copyName: finalFile?.name||''
     };
   }
 });
 save();openPage('final',cur)
}
function finalRec(){let c=get(cur);shell("📄 Final Record",head(c)+`<div class="ok">Final Payment completed — Final Record unlocked.</div><table><tr><th>Stage</th><th>Record</th></tr><tr><td>Contract</td><td>USD ${esc(c.price)}/MT | ${esc(c.qty)} MT</td></tr><tr><td>Booking</td><td>${c.bookings.length} booking(s)</td></tr><tr><td>Advance</td><td>USD ${esc(c.advance?.amount)}</td></tr><tr><td>Loading/B/L</td><td>${esc(c.loading?.bl)} | ${esc(c.loading?.qty)} MT</td></tr><tr><td>Invoice</td><td>${esc(c.invoice?.no)} | USD ${esc(c.invoice?.amount)}</td></tr><tr><td>Bill of Entry</td><td>${esc(c.boe?.no)} | Assessable INR ${esc(c.boe?.assess)} | BCD INR ${esc(c.boe?.bcd)} | SWS INR ${esc(c.boe?.sws)} | IGST INR ${esc(c.boe?.igst)}</td></tr><tr><td>Final Payment</td><td>USD ${esc(c.finalpay?.amount)} | INR ${esc(c.finalpay?.inr)} | Date ${esc(c.finalpay?.date)} | Our Bill No. ${esc(c.finalpay?.ref)}</td></tr></table><div class="card"><label>Final Document</label><input id="ffinal" class="file" type="file" accept=".pdf,image/*"><button class="btn s" onclick="complete()">✅ Complete Final Record</button></div>${c.final?'<div class="ok">✅ FINAL RECORD COMPLETED</div>':''}`)}
function complete(){let c=get(cur),f=file("ffinal");if(!f)return alert("Upload final document.");c.final={file:f,date:new Date().toISOString()};save();finalRec()}
document.addEventListener("input",e=>{if(e.target.id==="price"||e.target.id==="qty"){let p=parseFloat($("price")?.value||0),q=parseFloat($("qty")?.value||0);if($("contractValue"))$("contractValue").value=p&&q?(p*q).toFixed(2):"";}});render();
