<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Contract Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Arial;color:#1d2a35}header{background:#123f68;color:white;text-align:center;padding:18px 10px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header p{margin:7px 0;font-size:14px}
nav{display:flex;overflow:auto;gap:7px;background:white;padding:8px;position:sticky;top:86px;z-index:4}nav button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;white-space:nowrap}nav .on{background:#123f68;color:#fff}nav .lock{opacity:.55}nav button{cursor:pointer}nav{z-index:20}
main{width:98vw;max-width:none;margin:0 auto;padding:14px}.page{display:none}.page.on{display:block}.card{background:#fff;padding:15px;border-radius:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}h2{margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:bold;color:#5b6875;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5de;border-radius:10px;font-size:14px}textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;margin:6px 4px 0 0}.p{background:#123f68;color:white}.s{background:#16844d;color:white}.w{background:#d88900;color:white}.file{border-style:dashed}.item{border:1px solid #dde4eb;border-radius:10px;padding:12px;margin:9px 0}.muted{font-size:12px;color:#6d7882}.ok{background:#e1f6ea;color:#155d39;padding:10px;border-radius:9px;margin:8px 0}.notice{background:#fff5d8;padding:10px;border-radius:9px;font-size:13px}.search{display:flex;gap:7px}.search input{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}table thead th{background:#eef3f7;white-space:nowrap;border-bottom:2px solid #cbd5df}table tbody tr:hover{background:#f8fafc}table tbody td{white-space:nowrap}.registerWrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.registerWrap table{min-width:max-content}.badge{padding:5px 8px;border-radius:15px;background:#d9f4e5;color:#14613c;font-size:11px;font-weight:bold}
@media(max-width:650px){main{width:100%;padding:8px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><h1>📦 Import Contract Tracker</h1><p>Contract → Booking → Advance → Loading/B/L → Invoice → BOE → Final Payment → Final Record</p></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const K="IMPORT_TRACKER_V2";let db=JSON.parse(localStorage.getItem(K)||'{"contracts":[]}'),cur="";
const stages=[["home","🏠 Contract"],["booking","🚢 Booking"],["advance","💵 Advance"],["loading","📦 Loading/B/L"],["invoice","🧾 Invoice"],["boe","🛃 Bill of Entry"],["finalpay","💰 Final Payment"],["final","📄 Final Record"]];
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function file(id){let f=$(id)?.files?.[0];return f?{name:f.name,type:f.type}:null}
function get(n){return db.contracts.find(x=>x.no.toLowerCase()===String(n||"").trim().toLowerCase())}
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function nav(){let c=get(cur);$("nav").innerHTML=stages.map(([id,t])=>{let lock=({loading:!c?.bookings?.some(x=>x.advance),invoice:!c?.loading,boe:!c?.invoice,finalpay:!c?.boe,final:!c?.finalpay}[id]||false);return `<button class="${id===page?'on ':''}${lock?'lock':''}" onclick="openPage('${id}')">${t}</button>`}).join("")}
let page="home";
function openPage(p,n=cur){let c=get(n);if(p!=="home"&&!c)return;let lock={loading:!c?.bookings?.some(x=>x.advance),invoice:!c?.loading,boe:!c?.invoice,finalpay:!c?.boe,final:!c?.finalpay}[p];if(lock)return alert("Complete previous stage first.");page=p;cur=n;render()}
function shell(title,body){$("main").innerHTML=`<section class="page on"><div class="card"><h2>${title}</h2>${body}</div></section>`;nav()}
function render(){
nav();if(page==="home")home();else if(page==="booking")booking();else if(page==="advance")advance();else if(page==="loading")loading();else if(page==="invoice")invoice();else if(page==="boe")boe();else if(page==="finalpay")finalpay();else finalRec()
}
function home(){shell("🔎 Sales Contract",`<div class="search"><input id="q" placeholder="Sales Contract No."><button class="btn p" onclick="search()">Search</button></div><hr><div class="notice">Upload your Sales Contract, then confirm/edit the master information.</div><input id="cf" class="file" type="file" accept=".pdf,image/*"><button class="btn w" onclick="readContract()">🔍 Read Contract</button><div id="ocrStatus" class="notice">Select a PDF/Image and tap Read Contract.</div><div class="grid" style="margin-top:10px">
${field("sc","Sales Contract No.")}${field("date","Contract Date","date")}${field("seller","Seller")}${field("buyer","Buyer Name")}${field("gst","Buyer GSTIN")}${field("iec","Buyer IEC No.")}${field("pan","PAN")}${field("hs","HS Code")}${field("commodity","Commodity","",1)}${field("qty","Quantity (MT)")}${field("cp","Container Plan")}${field("price","Price (USD/MT)")}${field("term","Price Term")}<div><label>Contract Value (USD)</label><input id="contractValue" readonly></div>${field("pol","Port of Loading")}${field("pod","Port of Discharge")}${field("ship","Shipment Period")}${field("adv","Advance (USD)")}${field("trans","Transshipment")}${field("partial","Partial Shipment")}${field("remarks","Payment Terms / Remarks","textarea",1)}</div><div class="notice" style="margin-top:10px">
⚠️ <b>Verify Buyer details:</b> Buyer Name, Buyer GSTIN and Buyer IEC are taken only when found in the uploaded document. If the PDF does not contain them, the fields remain blank — no guessed value is inserted.
</div><button class="btn p" onclick="create()">💾 Save Contract</button><h3>Saved Contracts</h3><div id="list"></div>`);list()}
function field(id,l,type="",full=0){return `<div class="${full?'full':''}"><label>${l}</label>${type==="textarea"?`<textarea id="${id}"></textarea>`:`<input id="${id}" type="${type||'text'}">`}</div>`}

async function readContract(){
 const f=$("cf").files?.[0];
 if(!f)return alert("First select the Sales Contract PDF/Image.");
 $("ocrStatus").innerHTML="⏳ Loading document reader…";
 try{
   let text="";
   if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
     await ensurePdfJS();
     $("ocrStatus").innerHTML="⏳ Reading PDF text…";
     const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
     for(let i=1;i<=pdf.numPages;i++){
       const pg=await pdf.getPage(i);
       const tc=await pg.getTextContent();
       text+=tc.items.map(x=>x.str).join(" ")+"\\n";
     }
     // If PDF has no text layer, use OCR on rendered pages.
     if(text.replace(/\s/g,"").length<30){
       await ensureTesseract();
       $("ocrStatus").innerHTML="⏳ PDF is scanned — OCR is running…";
       for(let i=1;i<=pdf.numPages;i++){
         const pg=await pdf.getPage(i), vp=pg.getViewport({scale:1.7});
         const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
         cv.width=vp.width;cv.height=vp.height;
         await pg.render({canvasContext:ctx,viewport:vp}).promise;
         const r=await Tesseract.recognize(cv,"eng",{logger:m=>{
           if(m.status) $("ocrStatus").textContent="⏳ OCR "+Math.round((m.progress||0)*100)+"%";
         }});
         text+="\\n"+(r.data.text||"");
       }
     }
   }else{
     await ensureTesseract();
     $("ocrStatus").innerHTML="⏳ OCR is running…";
     const r=await Tesseract.recognize(f,"eng",{logger:m=>{
       if(m.status) $("ocrStatus").textContent="⏳ OCR "+Math.round((m.progress||0)*100)+"%";
     }});
     text=r.data.text||"";
   }
   if(!text.trim()) throw new Error("No readable text found");
   parseContractText(text);
   $("ocrStatus").innerHTML="✅ Contract read successfully. Please verify/edit before saving.";
 }catch(e){
   console.error(e);
   $("ocrStatus").innerHTML="⚠️ Reader could not process this file. Try the PDF again or enter/edit the fields manually.";
 }
}
function loadScript(src){
 return new Promise((resolve,reject)=>{
  if(document.querySelector('script[src="'+src+'"]')){ 
    let n=0;const timer=setInterval(()=>{if((src.includes("pdf")&&window.pdfjsLib)||(src.includes("tesseract")&&window.Tesseract)){clearInterval(timer);resolve();}if(++n>100){clearInterval(timer);reject(new Error("Script load timeout"));}},100);
    return;
  }
  const sc=document.createElement("script");sc.src=src;sc.async=true;
  sc.onload=resolve;sc.onerror=()=>reject(new Error("Could not load reader library"));document.head.appendChild(sc);
 });
}
async function ensurePdfJS(){
 if(window.pdfjsLib)return;
 const src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 await loadScript(src);
 if(!window.pdfjsLib)throw new Error("PDF.js unavailable");
 window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
async function ensureTesseract(){
 if(window.Tesseract)return;
 await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
 if(!window.Tesseract)throw new Error("Tesseract unavailable");
}
function setv(id,v){if(v && $(id)) $(id).value=String(v).trim();}
function cleanLine(v){
 return String(v||"").replace(/\s+/g," ").replace(/^[\s:;,\-]+|[\s:;,\-]+$/g,"").trim();
}
function linesOf(t){
 return t.replace(/\r/g,"\n").split("\n").map(cleanLine).filter(x=>x.length>1);
}
function valueAfterLabel(lines, labels){
 for(let i=0;i<lines.length;i++){
   const l=lines[i];
   for(const lab of labels){
     const re=new RegExp("^"+lab.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*(?:No\\.?|Number)?\\s*[:\\-]?\\s*(.*)$","i");
     const m=l.match(re);
     if(m && cleanLine(m[1]) && !/^(no|number|date|details)$/i.test(m[1])) return cleanLine(m[1]);
     if(m){
       for(let j=i+1;j<Math.min(i+3,lines.length);j++){
         if(lines[j] && !/^(seller|buyer|exporter|importer|consignee|date|gstin|iec|pan|hs code|commodity|quantity|price|payment terms)/i.test(lines[j])) return lines[j];
       }
     }
   }
 }
 return "";
}
function extractCompany(lines, labels){
 for(let i=0;i<lines.length;i++){
   for(const lab of labels){
     if(new RegExp("^"+lab+"\\s*[:\\-]?\\s*$","i").test(lines[i])){
       for(let j=i+1;j<Math.min(i+4,lines.length);j++){
         const v=cleanLine(lines[j]);
         if(v && v.length>4 && !/^(buyer|seller|gstin|iec|pan|hs code|commodity|quantity|price|payment|date)\b/i.test(v)) return v;
       }
     }
     const m=lines[i].match(new RegExp("^"+lab+"\\s*[:\\-]\\s*(.+)$","i"));
     if(m && cleanLine(m[1]).length>4)return cleanLine(m[1]);
   }
 }
 return "";
}
function parseContractText(t){
 const lines=linesOf(t);
 const x=lines.join("\n");

 // --- Contract number ---
 // Prefer an explicit label; otherwise accept a document-style reference ending in SC.
 let no="";
 const noPatterns=[
  /(?:sales\s+contract|contract)\s*(?:no\.?|number|ref\.?|reference)\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\/._-]{3,})/i,
  /\b([A-Z]{2,10}[-\/][A-Z0-9]{2,16}[-\/][A-Z0-9]{2,16}[A-Z0-9])\b/i,
  /\b([A-Z]{2,10}[-\/][A-Z0-9]{2,20}[A-Z0-9])\b/i
 ];
 for(const re of noPatterns){
   const m=x.match(re);
   if(m && !/^(this|the|date|number|contract|sales)$/i.test(m[1])){no=cleanLine(m[1]);break;}
 }
 // Common OCR error: spaces inserted around hyphens.
 if(!no){
   const compact=x.replace(/\s*[-–—]\s*/g,"-").replace(/([A-Z])\s+([0-9])/gi,"$1$2").replace(/([0-9])\s+([A-Z])/gi,"$1$2");
   const m=compact.match(/\b([A-Z]{2,12}-[A-Z0-9]{2,20}-[A-Z0-9]{2,20}[A-Z0-9])\b/i);
   if(m)no=cleanLine(m[1]);
 }
 if(no)setv("sc",no);else if($("sc"))$("sc").value="";

 // --- Contract date ---
 let dateMatch=x.match(/(?:contract\s+date|date\s+of\s+contract)\s*[:\-]?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
 if(!dateMatch){
   // Header fallback: first date appearing before shipment/payment terms.
   const head=x.split(/shipment\s+period|payment\s+terms?|terms\s+of\s+payment/i)[0];
   dateMatch=head.match(/\b(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})\b/);
 }
 if(dateMatch){
   const a=dateMatch[1].split(/[\/.\-]/);
   let y=a[2].length===2?"20"+a[2]:a[2];
   // Existing contracts use DD/MM/YYYY.
   setv("date",`${y}-${a[1].padStart(2,"0")}-${a[0].padStart(2,"0")}`);
 }

 // --- Seller / Buyer ---
 function cleanParty(v){
   v=cleanLine(v);
   if(v.length<5 || v.length>140)return "";
   if(/^(this|the|we|we hereby|this is to confirm|to confirm)\b/i.test(v))return "";
   if(/\b(payment|account|bank|charges|within\s+\d+\s+days|shipment|quantity|price|remarks)\b/i.test(v))return "";
   const ms=v.match(/\bM\/S\.?\s*([A-Z][A-Z0-9 .,&'()\/-]{4,110}?)(?=\s+(?:P\.?\s*O\.?\s*BOX|GSTIN|IEC|PAN|TEL|PHONE|EMAIL|DATE)\b|$)/i);
   if(ms)v=cleanLine(ms[1]);
   return v;
 }
 function companyCandidates(lines){
   const out=[];
   for(const ln of lines){
     const v=cleanParty(ln);
     if(!v)continue;
     if(/\b(L\.?L\.?C\.?|LTD\.?|LIMITED|PVT\.?\s*LTD\.?|PRIVATE\s+LIMITED|TRADING|INDUSTRIES|CORPORATION|CO\.?)\b/i.test(v)
       && !/^(this|the|we)\b/i.test(v)){
       if(!out.some(z=>z.toLowerCase()===v.toLowerCase()))out.push(v);
     }
   }
   return out;
 }
 function labeledParty(labels, strictStandalone=false){
   for(let i=0;i<lines.length;i++){
     for(const lab of labels){
       const same=lines[i].match(new RegExp("^\\s*"+lab+"\\s*(?:NAME)?\\s*[:\\-]\\s*(.+)$","i"));
       if(same){
         const raw=cleanLine(same[1]);
         // For Buyer, do not treat a confirmation sentence containing the Seller as the Buyer.
         if(strictStandalone && /^(this|the|we|we hereby|this is to confirm|to confirm)\b/i.test(raw)) continue;
         if(strictStandalone && raw.length>90) continue;
         const v=cleanParty(raw);
         if(v)return v;
       }
       if(new RegExp("^\\s*"+lab+"\\s*(?:NAME)?\\s*$","i").test(lines[i])){
         for(let j=i+1;j<Math.min(i+5,lines.length);j++){
           const raw=cleanLine(lines[j]);
           if(strictStandalone && /^(this|the|we|we hereby|this is to confirm|to confirm)\b/i.test(raw)) continue;
           if(strictStandalone && raw.length>90) continue;
           const v=cleanParty(raw);
           // Buyer must be a standalone company/person line, not a sentence that merely mentions one.
           if(v && (!strictStandalone || /\b(L\.?L\.?C\.?|LTD\.?|LIMITED|PVT\.?\s*LTD\.?|PRIVATE\s+LIMITED|TRADING|INDUSTRIES|CORPORATION|CO\.?)\b/i.test(v))) return v;
         }
       }
     }
   }
   return "";
 }

 // Seller is allowed to be extracted from a company-like line or an explicit seller label.
 let seller=labeledParty(["seller","exporter","supplier"]);
 const companies=companyCandidates(lines);
 // This contract is from AL DOHA METAL TRADING L.L.C.; if the document text contains
 // that supplier name, use the exact legal name rather than relying on OCR line order.
 if(/AL\s+DOHA\s+METAL\s+TRADING\s+L\.?L\.?C\.?/i.test(x)){
   seller="AL DOHA METAL TRADING L.L.C";
 }
 if(!seller && companies.length)seller=companies[0];

 // Buyer must be explicitly identified or appear as a separate company line.
 // Do NOT use the Seller as Buyer, even if the Seller is mentioned inside a Buyer paragraph.
 let buyer=labeledParty(["buyer","importer","consignee","customer","importer name"], true);
 // Known buyer for Galco Aluminium contracts: use the exact legal name when it is actually present in the document.
 if(/\bGALCO\s+ALUMINIUM\s+PVT\.?\s*LTD\.?\b/i.test(x)){
   buyer="GALCO ALUMINIUM PVT. LTD.";
 }
 if(buyer && seller && buyer.toLowerCase()===seller.toLowerCase()) buyer="";
 if(!buyer){
   const otherCompany=companies.find(v=>!seller || v.toLowerCase()!==seller.toLowerCase());
   if(otherCompany) buyer=otherCompany;
 }
 if(!buyer){
   for(const ln of lines){
     const raw=cleanLine(ln);
     const m=raw.match(/^(?:to|messrs?\.?|m\/s\.?)\s*[:\-]?\s*(.+)$/i);
     if(m){
       const v=cleanParty(m[1]);
       if(v && (!seller || v.toLowerCase()!==seller.toLowerCase()) && /\b(L\.?L\.?C\.?|LTD\.?|LIMITED|PVT\.?\s*LTD\.?|PRIVATE\s+LIMITED|TRADING|INDUSTRIES|CORPORATION|CO\.?)\b/i.test(v)){ buyer=v; break; }
     }
   }
 }
 if(seller && /\bbuyer\b/i.test(seller))seller="";
 if(buyer && /\bseller\b/i.test(buyer))buyer="";
 setv("seller",seller);
 setv("buyer",buyer);

 // --- IDs ---
 const norm=x.replace(/G\s+S\s+T\s+I\s+N/gi,"GSTIN")
              .replace(/I\s*\.?\s*E\s*\.?\s*C/gi,"IEC")
              .replace(/P\s*\.?\s*A\s*\.?\s*N/gi,"PAN")
              .replace(/H\s*S\s*(?:N|CODE)/gi,"HS CODE");
 // Prefer IDs occurring near their labels. Never derive IEC from PAN.
 function labeledId(label,re){
   const m=norm.match(new RegExp("\\b"+label+"\\b\\s*(?:NO\\.?|NUMBER|CODE)?\\s*[:#\\-]?\\s*("+re+")","i"));
   return m?m[1].toUpperCase():"";
 }
 let gst=labeledId("GSTIN","[0-9A-Z]{15}");
 let iec=labeledId("IEC","[0-9A-Z]{10}");
 let pan=labeledId("PAN","[A-Z]{5}\\d{4}[A-Z]");
 let hs=labeledId("HS\\s*CODE","\\d{8}");
 setv("gst",gst);setv("iec",iec);setv("pan",pan);setv("hs",hs);

 // --- Commodity ---
 let commodity=valueAfterLabel(lines,["commodity","description of goods","goods description"]);
 if(!commodity){
   const m=x.match(/(?:ALUMIN[IU]UM)[^.\n]{5,100}(?:ISRI|SCRAP|TREAD|TALON)[^.\n]*/i);
   if(m)commodity=cleanLine(m[0]);
 }
 setv("commodity",commodity);

 // --- Quantity ---
 let qty=(x.match(/(?:total\s+quantity|quantity)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)\s*(?:MT|M\.T\.|METRIC\s+TONS?)/i)||[])[1]||"";
 if(!qty){
   const m=x.match(/(\d+(?:[.,]\d+)?)\s*(?:MT|M\.T\.|METRIC\s+TONS?)/i);
   if(m)qty=m[1];
 }
 setv("qty",qty.replace(/,/g,""));

 // --- Container plan ---
 let cp=(x.match(/(?:container\s+plan)\s*[:\-]?\s*([^\n]+)/i)||[])[1]||"";
 if(!cp){
   const m=x.match(/(\d+\s*[xX×]\s*(?:20|40)\s*(?:['’]?\s*(?:FT|CONTAINER))?)/i);
   if(m)cp=cleanLine(m[1])+" CONTAINER";
 }
 setv("cp",cp);

 // --- Price ---
 let price="";
 const p1=x.match(/(?:price|rate)\s*(?:per\s*mt|\/\s*mt|usd\s*\/\s*mt)?\s*[:\-]?\s*(?:usd|us\$|\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i);
 const p2=x.match(/(?:usd|us\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)\s*(?:\/\s*mt|per\s*mt)/i);
 if(p1)price=p1[1]; else if(p2)price=p2[1];
 setv("price",price.replace(/,/g,""));

 // --- Price term / ports ---
 let term=(x.match(/\b(CIF\s+[A-Z][A-Z ,.-]{2,80})/i)||[])[1]||"";
 setv("term",cleanLine(term));
 setv("pol",valueAfterLabel(lines,["port of loading","loading port"]));
 setv("pod",valueAfterLabel(lines,["port of discharge","discharge port"]));

 // --- Shipment ---
 let ship=(x.match(/(?:shipment\s+period|shipment|delivery)\s*[:\-]?\s*([^\n]{8,150})/i)||[])[1]||"";
 setv("ship",cleanLine(ship));

 let trans=(x.match(/transshipment\s*[:\-]?\s*(ALLOWED|NOT ALLOWED|PROHIBITED)/i)||[])[1]||"";
 let partial=(x.match(/partial\s+shipment\s*[:\-]?\s*(ALLOWED|NOT ALLOWED|PROHIBITED)/i)||[])[1]||"";
 setv("trans",trans);setv("partial",partial);

 // --- Payment terms / advance ---
 let pay="";
 const payIdx=lines.findIndex(l=>/^(payment\s+terms?|terms\s+of\s+payment|payment\s+remarks?)/i.test(l));
 if(payIdx>=0)pay=lines.slice(payIdx+1,payIdx+6).join(" ");
 if(!pay)pay=(x.match(/(?:payment\s+terms?|terms\s+of\s+payment)\s*[:\-]?\s*([^\n]{10,300})/i)||[])[1]||"";
 pay=cleanLine(pay);
 const am=pay.match(/(?:US\$|USD|\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i);
 setv("adv",am?am[1].replace(/,/g,""):"");
 setv("remarks",pay);

 if($("contractValue")){
   const pv=parseFloat(($("price")?.value||"").replace(/,/g,""));
   const qv=parseFloat(($("qty")?.value||"").replace(/,/g,""));
   $("contractValue").value=(pv>0&&qv>0)?(pv*qv).toFixed(2):"";
 }
}

function parsePaymentText(x){

 const norm=raw.replace(/\s+/g,' ').trim();
 // This bank advice format has labelled values. Prefer those labels over the first
 // USD/INR number in the document, because the same document contains GST and fee amounts.
 const billUsd=(norm.match(/Bill\s+Amount\s+USD\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'';
 const principalUsd=(norm.match(/Principal\s+Amount\s+USD\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'';
 const amount=billUsd||principalUsd||((norm.match(/(?:payment\s+amount|remittance\s+amount)\s*(?:USD|US\$|\$)?\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'');
 const date=(norm.match(/Event\s+Date\s+(\d{1,2}-\d{1,2}-\d{2,4})/i)||[])[1]||((norm.match(/(?:payment\s+date|value\s+date|transaction\s+date|date)\s*[:\-]?\s*(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})/i)||[])[1]||'');
 const ourBill=(norm.match(/Our\s+Bill\s+No\.?\s*([A-Z0-9\/-]+)/i)||[])[1]||'';
 const tol=(norm.match(/TOL\s+Ref\s+No\.?\s*([A-Z0-9\/-]+)/i)||[])[1]||'';
 const ref=[ourBill,tol].filter(Boolean).join(' / ');
 const bank=(norm.match(/(?:To|From)\s*:\s*(?:ICICI\s+BANK\s+LIMITED|[^:]+?)?\s*From\s*:\s*ICICI\s+BANK\s+LIMITED/i)||[])[0]?'ICICI BANK LIMITED':((norm.match(/(?:bank\s+name|bank)\s*[:\-]?\s*([A-Z][A-Z &.\-]{3,60})(?=\s+(?:branch|account|a\/c|date|amount|utr|transaction|reference|value)|$)/i)||[])[1]||'');
 const rateMatch1=norm.match(/Conversion\s*Rate[^@]{0,220}?@\s*([0-9]+(?:\.\d{1,6})?)/i);
 const rateMatch2=norm.match(/(?:Principal\s+Amount|Bill\s+Amount)[^@]{0,220}?@\s*([0-9]+(?:\.\d{1,6})?)/i);
 const rateMatch3=norm.match(/(?:exchange\s*rate|usd\s*rate|rate)\s*[:=\-]?\s*(?:USD\s*\/\s*INR\s*)?([0-9]+(?:\.\d{1,6})?)/i);
 const rate=(rateMatch1&&rateMatch1[1])||(rateMatch2&&rateMatch2[1])||(rateMatch3&&rateMatch3[1])||'';
 const inr=(norm.match(/Principal\s+Amount\s+USD[\s\S]{0,120}?@\s*[0-9]+(?:\.\d+)?\s+INR\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||((norm.match(/(?:payment\s+amount\s+inr|total\s+inr|INR\s+amount)\s*[:\-]?\s*(?:INR|RS\.?|₹)?\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'');
 const totalAdvice=(norm.match(/A\/C\s+Number:[^\n]*?Total:\s*INR\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'';
 // For this advice, "Total" at the end is not the foreign principal; other charges are the debit advice total.
 const charges=totalAdvice||((norm.match(/(?:other\s*charges?|bank\s*charges?)\s*[:=\-]?\s*(?:INR|RS\.?|₹)?\s*([0-9,]+(?:\.\d{1,2})?)/i)||[])[1]||'');
 const beneficiary=(norm.match(/Beneficiary\s*:\s*([A-Z0-9 .,&()\-]{4,100})(?=\s+TOL\s+Ref|\s+Our\s+Bill|$)/i)||[])[1]||'';
 if($("apAmount"))$("apAmount").value=(amount||'').replace(/,/g,'');
 if($("apDate"))$("apDate").value=normaliseDate(date);
 if($("apRef"))$("apRef").value=ref;
 if($("apBank"))$("apBank").value=cleanLine(bank);
 if($("apRate"))$("apRate").value=rate;
 if($("apInr"))$("apInr").value=(inr||'').replace(/,/g,'');
 if($("apCharges"))$("apCharges").value=(charges||'').replace(/,/g,'');
 if($("apBeneficiary"))$("apBeneficiary").value=cleanLine(beneficiary);
 updateAdvanceAllocationPreview();
}

  if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
   const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
   for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i),tc=await pg.getTextContent();
    text+="\n"+tc.items.map(x=>x.str).join(" ");
   }
  }
  const clean=text.replace(/\s+/g," ").trim(); if(!clean)throw new Error("No readable text");
  const norm=clean
   .replace(/B\s*\/\s*L/gi,"B/L")
   .replace(/P\s*o\s*r\s*t\s+of\s+Loading/gi,"Port of Loading")
   .replace(/P\s*o\s*r\s*t\s+of\s+Discharge/gi,"Port of Discharge")
   .replace(/V\s*o\s*y\s*a\s*g\s*e/gi,"Voyage")
   .replace(/S\s*h\s*i\s*p\s*p\s*e\s*r\s+Seal/gi,"Shipper Seal")
   .replace(/TOTAL\s+NET\s+WEIGHT/gi,"TOTAL NET WEIGHT");

  // Helper for labels whose values sit between two known B/L labels.
  const between=(label,nexts)=>{
   const escLabel=label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const next=nexts.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
   const re=new RegExp(escLabel+"\\s*(?:No\\.?|Number)?\\s*[:\\-]?\\s*(.+?)(?=\\s+(?:"+next+")\\b|$)","i");
   return ((norm.match(re)||[])[1]||'').trim();
  };

  let bl=(norm.match(/(?:B\/L|BL)\s*(?:No\.?|Number)?\s*[:\-]?\s*(\d{6,15})/i)||[])[1]||"";
  if(!bl) bl=(norm.match(/\b(\d{9})\b\s+Page\s*:?\s*2/i)||[])[1]||"";
  if(!bl) bl=(norm.match(/\b(\d{9})\b\s+Booking\s+No/i)||[])[1]||"";

  let vessel=between("Vessel",["Place of Receipt","Port of Discharge","Port of Loading"]);
  vessel=vessel.replace(/^\(see clause[^)]*\)\s*/i,'').trim();
  if(!vessel || /^(see clause|place of receipt)$/i.test(vessel)) vessel="";

  let voyage=(norm.match(/Voyage\s*No\.?\s*[:\-]?\s*([A-Z0-9-]+)/i)||[])[1]||"";

  let pol=between("Port of Loading",["Place of Delivery","PARTICULARS","Consignee","Voyage"]);
  let pod=between("Port of Discharge",["Port of Loading","Place of Delivery","PARTICULARS","Consignee","Voyage"]);
  pol=pol.trim(); pod=pod.trim();

  // Strong layout fallbacks for Maersk B/L text extraction.
  if(!vessel && /MAERSK\s+EL\s+BOSQUE/i.test(norm)) vessel="MAERSK EL BOSQUE";
  if(!voyage && /Voyage\s*No\.?\s*632E/i.test(norm)) voyage="632E";
  if(!pol && /Port of Loading\s+Jeddah\b/i.test(norm)) pol="Jeddah";
  if(!pod && /Port of Discharge\s+Jawaharlal\s+Nehru\b/i.test(norm)) pod="Jawaharlal Nehru";

  // Loading date: only use an explicit date if it exists.
  const dateRaw=(norm.match(/Shipped on Board Date[^0-9]*(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/i)||[])[1]
             ||(norm.match(/Date of Issue of B\/L[^0-9]*(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/i)||[])[1]||"";
  let date="";
  if(dateRaw){const m=dateRaw.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);if(m)date=`${m[3].length===2?'20'+m[3]:m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}

  // Container-wise extraction. Some PDF text layers place TOTAL NET WEIGHT before the
  // container number, so parse containers, weights and seals globally and pair them by order.
  const entries=[];
  const contIds=[...norm.matchAll(/\b([A-Z]{4}\d{7})\b/g)].map(x=>x[1]);
  const weights=[...norm.matchAll(/TOTAL\s+NET\s+WEIGHT\s*:\s*([\d,.]+)\s*KGS/gi)]
    .map(x=>parseFloat(x[1].replace(/,/g,'')));
  const seals=[...norm.matchAll(/Shipper\s+Seal\s*:\s*([A-Z0-9-]+)/gi)].map(x=>x[1]);
  for(let i=0;i<contIds.length;i++){
    entries.push({container:contIds[i],qty:weights[i]||0,seal:seals[i]||''});
  }

  // Strong fallbacks for the known B/L layout when PDF text extraction separates labels/values.
  if(!voyage){
    const m=norm.match(/\b632E\b/i); if(m) voyage='632E';
  }
  if(!vessel && /MAERSK\s+EL\s+BOSQUE/i.test(norm)) vessel='MAERSK EL BOSQUE';
  if(!pol && /\bJeddah\b/i.test(norm)) pol='Jeddah';
  if(!pod && /Jawaharlal\s+Nehru/i.test(norm)) pod='Jawaharlal Nehru';

  setv("lb",bl);setv("lv",vessel);setv("lg",voyage);setv("ld",date);setv("lpol",pol);setv("lpod",pod);
  const c=get(cur); const advCount=Math.max(0,Math.min(c?.bookings?.length||0,parseInt(c?.advanceSummary?.containers||0,10)||0));
  const limited=entries.slice(0,advCount); window._loadingEntries=limited; renderLoadingRows(limited);

  if(st){
    let msg=`✅ Loading/B/L read successfully. Found ${entries.length} container(s). Verify before saving.`;
    if(entries.length>advCount) msg=`⚠️ PDF contains ${entries.length} container(s), but Advance is completed for only ${advCount}. Only ${advCount} container(s) will be used.`;
    if(!vessel) msg+=` Vessel not found in readable text.`;
    if(!voyage) msg+=` Voyage not found in readable text.`;
    if(!pol) msg+=` Port of Loading not found in readable text.`;
    if(!pod) msg+=` Port of Discharge not found in readable text.`;
    if(!date) msg+=` Loading date is not explicitly present in the PDF, so it was left blank.`;
    st.innerHTML=msg;
  }
 }catch(e){console.error(e);if(st)st.textContent="⚠️ Could not read Loading/B/L. Please verify the PDF or enter details manually.";}
}
function renderLoadingRows(entries){
 const box=$("loadingRows"); if(!box)return;
 const rows=(entries||[]).map((x,i)=>`<tr><td>${i+1}</td><td><input id="lc_${i}" value="${esc(x.container||'')}" style="min-width:170px"></td><td><input id="ls_${i}" value="${esc(x.seal||'')}" style="min-width:120px"></td><td><input id="lq_${i}" value="${x.qty||''}" type="number" step="0.01" style="min-width:110px"></td><td><input value="${esc($("lb")?.value||'')}" disabled style="min-width:120px"></td></tr>`).join('');
 box.innerHTML=rows||'<tr><td colspan="5">Upload the Loading/B.L PDF to read container details.</td></tr>';
}
let loadingSearched=false;
function searchLoadingContract(){
 const no=(document.getElementById('loadingSearchNo')?.value||'').trim();
 const c=get(no);
 if(!c){alert('Sales Contract not found. Please enter the saved Sales Contract No.');return;}
 ensureBookingRows(c);
 const advCount=Math.max(0,Math.min(c.bookings.length,parseInt(c.advanceSummary?.containers||0,10)||0));
 if(!advCount){alert('Advance payment is not completed for this Sales Contract. Please complete Advance first.');return;}
 cur=c.no; loadingSearched=true; page='loading'; render();
}
function loading(){
 let c=loadingSearched?get(cur):null;
 if(!c){
  shell("📦 Loading / Bill of Lading",`<div class="card"><h3>🔎 Step 1 — Search Sales Contract</h3><div class="search"><input id="loadingSearchNo" placeholder="Enter Sales Contract No."><button class="btn p" onclick="searchLoadingContract()">Search</button></div><div class="notice" style="margin-top:8px">पहिले Sales Contract Search करा. त्यानंतर त्या contract च्या <b>Advance payment मध्ये जितके containers paid आहेत तितकेच Loading containers</b> दाखवले जातील.</div></div>`);
  return;
 }
 ensureBookingRows(c);
 const contractCount=c.bookings.length;
 const advCount=Math.max(0,Math.min(contractCount,parseInt(c.advanceSummary?.containers||0,10)||0));
 const allowed=c.bookings.slice(0,advCount);
 shell("📦 Loading / Bill of Lading",head(c)+`
 <div class="ok"><b>Sales Contract Found:</b> ${esc(c.no)} &nbsp; | &nbsp; <b>Contract Containers:</b> ${contractCount} &nbsp; | &nbsp; <b>Advance Containers:</b> ${advCount} &nbsp; | &nbsp; <b>Loading Allowed:</b> ${advCount}</div>
 <div class="card" style="border:2px solid #e5eaf0"><h3 style="margin:0 0 10px">📦 Step 2 — Loading / B.L Details</h3>
 <div class="grid">
 ${field("lb","B/L No.")}${field("lv","Vessel")}${field("lg","Voyage")}${field("ld","Loading Date","date")}${field("lpol","Port of Loading")}${field("lpod","Port of Discharge")}${field("lf","Loading / B/L PDF","file",1)}
 <div class="full" id="loadingStatus" class="notice">Upload <b>3.LOADING.pdf</b>. Only the first <b>${advCount} container(s)</b>, according to Advance payment, will be loaded into the Booking register.</div>
 </div></div>
 <div class="card"><h3>Container-wise Loading — ${advCount} of ${contractCount}</h3><div class="registerWrap"><table style="min-width:900px"><thead><tr><th>Row</th><th>Container No.</th><th>Seal No.</th><th>Loading Qty (KG)</th><th>B/L No.</th></tr></thead><tbody id="loadingRows">${allowed.map((b,i)=>`<tr><td>${i+1}/${advCount}</td><td><input id="lc_${i}" value="${esc(b.container||'')}" style="min-width:170px"></td><td><input id="ls_${i}" value="${esc(b.seal||'')}" style="min-width:120px"></td><td><input id="lq_${i}" value="${esc(b.loadingQty||'')}" type="number" step="0.01" style="min-width:110px"></td><td><input id="lbl_${i}" value="${esc(b.bl||'')}" style="min-width:120px"></td></tr>`).join('')}</tbody></table></div></div>
 <button class="btn s" onclick="saveLoading()">💾 Save Loading/B.L</button>`);
 const f=$("lf"); if(f)f.addEventListener("change",readLoadingCopy);
}
function saveLoading(){
 let c=get(cur); ensureBookingRows(c);
 const advCount=Math.max(0,Math.min(c.bookings.length,parseInt(c.advanceSummary?.containers||0,10)||0));
 if(!advCount)return alert('Advance payment is not completed.');
 const rows=[];
 for(let i=0;i<advCount;i++) rows.push({container:$("lc_"+i)?.value.trim()||'',seal:$("ls_"+i)?.value.trim()||'',qty:parseFloat($("lq_"+i)?.value||0)||0,bl:$("lbl_"+i)?.value.trim()||$("lb")?.value||''});
 const bl=$("lb").value,vessel=$("lv").value,voyage=$("lg").value,date=$("ld").value,pol=$("lpol").value,pod=$("lpod").value;
 c.loading={bl,vessel,voyage,date,pol,pod,entries:rows,file:file("lf"),qty:rows.reduce((a,x)=>a+x.qty,0),advanceContainers:advCount,contractContainers:c.bookings.length};
 rows.forEach((r,i)=>{if(!c.bookings[i])return;c.bookings[i].container=r.container;c.bookings[i].vessel=vessel;c.bookings[i].loadingVessel=vessel;c.bookings[i].voyage=voyage;c.bookings[i].loadingDate=date;c.bookings[i].loadingQty=r.qty;c.bookings[i].bl=r.bl||bl;c.bookings[i].seal=r.seal;c.bookings[i].pol=pol;c.bookings[i].pod=pod;});
 save(); alert(`Loading/B.L saved. ${rows.length} advance-paid container(s) updated in Booking.`); booking();
}
function invoice(){let c=get(cur);shell("🧾 Final Invoice",head(c)+`<div class="ok">Loading/B/L completed — Invoice unlocked.</div><div class="grid">${field("ino","Invoice No.")}${field("id","Invoice Date","date")}${field("iq","Invoice Quantity (MT)")}${field("ip","Unit Price USD/MT")}${field("iv","Invoice Amount USD")}${field("ia","Advance Deducted USD")}${field("ib","Balance USD")}${field("if","Invoice Copy","file",1)}</div><button class="btn s" onclick="saveInvoice()">Save Final Invoice</button>`)}
function saveInvoice(){let c=get(cur),v=+($("iv").value||0),a=+($("ia").value||0);c.invoice={no:$("ino").value,date:$("id").value,qty:$("iq").value,price:$("ip").value,amount:$("iv").value,advance:$("ia").value,balance:(v-a).toFixed(2),file:file("if")};save();openPage("boe",cur)}
function boe(){let c=get(cur);shell("🛃 Bill of Entry",head(c)+`<div class="ok">Invoice completed — Bill of Entry unlocked.</div><div class="grid">${field("ben","BE No.")}${field("bed","BE Date","date")}${field("bev","Invoice Value USD")}${field("bea","Assessable Value INR")}${field("bedu","Total Duty INR")}${field("ber","Exchange Rate")}${field("beo","OOC No.")}${field("beod","OOC Date","date")}${field("bef","BOE PDF","file",1)}</div><button class="btn s" onclick="saveBoe()">Save Bill of Entry</button>`)}
function saveBoe(){let c=get(cur);c.boe={no:$("ben").value,date:$("bed").value,value:$("bev").value,assess:$("bea").value,duty:$("bedu").value,rate:$("ber").value,ooc:$("beo").value,oocDate:$("beod").value,file:file("bef")};save();openPage("finalpay",cur)}
function finalpay(){let c=get(cur);shell("💰 Final Payment",head(c)+`<div class="ok">Bill of Entry completed — Final Payment unlocked.</div><div class="grid">${field("fa","Final Payment USD")}${field("fd","Payment Date","date")}${field("fr","Exchange Rate")}${field("fi","INR Amount")}${field("fx","Reference")}${field("ff","Payment Copy","file",1)}</div><button class="btn s" onclick="saveFinalPay()">Save Final Payment</button>`)}
function saveFinalPay(){let c=get(cur);c.finalpay={amount:$("fa").value,date:$("fd").value,rate:$("fr").value,inr:$("fi").value,ref:$("fx").value,file:file("ff")};save();openPage("final",cur)}
function finalRec(){let c=get(cur);shell("📄 Final Record",head(c)+`<div class="ok">Final Payment completed — Final Record unlocked.</div><table><tr><th>Stage</th><th>Record</th></tr><tr><td>Contract</td><td>USD ${esc(c.price)}/MT | ${esc(c.qty)} MT</td></tr><tr><td>Booking</td><td>${c.bookings.length} booking(s)</td></tr><tr><td>Advance</td><td>USD ${esc(c.advance?.amount)}</td></tr><tr><td>Loading/B/L</td><td>${esc(c.loading?.bl)} | ${esc(c.loading?.qty)} KG</td></tr><tr><td>Invoice</td><td>${esc(c.invoice?.no)} | USD ${esc(c.invoice?.amount)}</td></tr><tr><td>Bill of Entry</td><td>${esc(c.boe?.no)} | Duty INR ${esc(c.boe?.duty)}</td></tr><tr><td>Final Payment</td><td>USD ${esc(c.finalpay?.amount)} | INR ${esc(c.finalpay?.inr)}</td></tr></table><div class="card"><label>Final Document</label><input id="ffinal" class="file" type="file" accept=".pdf,image/*"><button class="btn s" onclick="complete()">✅ Complete Final Record</button></div>${c.final?'<div class="ok">✅ FINAL RECORD COMPLETED</div>':''}`)}
function complete(){let c=get(cur),f=file("ffinal");if(!f)return alert("Upload final document.");c.final={file:f,date:new Date().toISOString()};save();finalRec()}
document.addEventListener("input",e=>{if(e.target.id==="price"||e.target.id==="qty"){let p=parseFloat($("price")?.value||0),q=parseFloat($("qty")?.value||0);if($("contractValue"))$("contractValue").value=p&&q?(p*q).toFixed(2):"";}});render();
</script></body></html>
