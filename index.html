<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Contract Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Arial;color:#1d2a35}header{background:#123f68;color:white;text-align:center;padding:18px 10px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header p{margin:7px 0;font-size:14px}
nav{display:flex;overflow:auto;gap:7px;background:white;padding:8px;position:sticky;top:86px;z-index:4}nav button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;white-space:nowrap}nav .on{background:#123f68;color:#fff}nav .lock{opacity:.4}
main{max-width:950px;margin:auto;padding:12px}.page{display:none}.page.on{display:block}.card{background:#fff;padding:15px;border-radius:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}h2{margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:bold;color:#5b6875;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5de;border-radius:10px;font-size:14px}textarea{min-height:80px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;margin:6px 4px 0 0}.p{background:#123f68;color:white}.s{background:#16844d;color:white}.w{background:#d88900;color:white}.file{border-style:dashed}.item{border:1px solid #dde4eb;border-radius:10px;padding:12px;margin:9px 0}.muted{font-size:12px;color:#6d7882}.ok{background:#e1f6ea;color:#155d39;padding:10px;border-radius:9px;margin:8px 0}.notice{background:#fff5d8;padding:10px;border-radius:9px;font-size:13px}.search{display:flex;gap:7px}.search input{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.badge{padding:5px 8px;border-radius:15px;background:#d9f4e5;color:#14613c;font-size:11px;font-weight:bold}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><h1>📦 Import Contract Tracker</h1><p>Contract → Booking → Advance → Loading/B/L → Invoice → BOE → Final Payment → Final Record</p></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const K="IMPORT_TRACKER_V2";let db=JSON.parse(localStorage.getItem(K)||'{"contracts":[]}'),cur="";
const stages=[["home","🏠 Contract"],["booking","🚢 Booking"],["advance","💵 Advance"],["loading","📦 Loading/B/L"],["invoice","🧾 Invoice"],["boe","🛃 Bill of Entry"],["finalpay","💰 Final Payment"],["final","📄 Final Record"]];
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function file(id){let f=$(id)?.files?.[0];return f?{name:f.name,type:f.type}:null}
function get(n){return db.contracts.find(x=>x.no.toLowerCase()===String(n||"").trim().toLowerCase())}
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function nav(){let c=get(cur);$("nav").innerHTML=stages.map(([id,t])=>{let lock=({advance:!(c?.bookings?.some(x=>x.released)),loading:!c?.advance,invoice:!c?.loading,boe:!c?.invoice,finalpay:!c?.boe,final:!c?.finalpay}[id]||false);return `<button class="${id===page?'on ':''}${lock?'lock':''}" onclick="openPage('${id}')">${t}</button>`}).join("")}
let page="home";
function openPage(p,n=cur){let c=get(n);if(p!=="home"&&!c)return;let lock={advance:!(c?.bookings?.some(x=>x.released)),loading:!c?.advance,invoice:!c?.loading,boe:!c?.invoice,finalpay:!c?.boe,final:!c?.finalpay}[p];if(lock)return alert("Complete previous stage first.");page=p;cur=n;render()}
function shell(title,body){$("main").innerHTML=`<section class="page on"><div class="card"><h2>${title}</h2>${body}</div></section>`;nav()}
function render(){
nav();if(page==="home")home();else if(page==="booking")booking();else if(page==="advance")advance();else if(page==="loading")loading();else if(page==="invoice")invoice();else if(page==="boe")boe();else if(page==="finalpay")finalpay();else finalRec()
}
function home(){shell("🔎 Sales Contract",`<div class="search"><input id="q" placeholder="Sales Contract No."><button class="btn p" onclick="search()">Search</button></div><hr><div class="notice">Upload your Sales Contract, then confirm/edit the master information.</div><input id="cf" class="file" type="file" accept=".pdf,image/*"><button class="btn w" onclick="readContract()">🔍 Read Contract</button><div id="ocrStatus" class="notice">Select a PDF/Image and tap Read Contract.</div><div class="grid" style="margin-top:10px">
${field("sc","Sales Contract No.")}${field("date","Contract Date","date")}${field("seller","Seller")}${field("buyer","Buyer")}${field("gst","GSTIN")}${field("iec","IEC")}${field("pan","PAN")}${field("hs","HS Code")}${field("commodity","Commodity","",1)}${field("qty","Quantity (MT)")}${field("cp","Container Plan")}${field("price","Price (USD/MT)")}${field("term","Price Term")}<div><label>Contract Value (USD)</label><input id="contractValue" readonly></div>${field("pol","Port of Loading")}${field("pod","Port of Discharge")}${field("ship","Shipment Period")}${field("adv","Advance (USD)")}${field("trans","Transshipment")}${field("partial","Partial Shipment")}${field("remarks","Payment Terms / Remarks","textarea",1)}</div><button class="btn p" onclick="create()">💾 Save Contract</button><h3>Saved Contracts</h3><div id="list"></div>`);list()}
function field(id,l,type="",full=0){return `<div class="${full?'full':''}"><label>${l}</label>${type==="textarea"?`<textarea id="${id}"></textarea>`:`<input id="${id}" type="${type||'text'}">`}</div>`}

async function readContract(){
 const f=$("cf").files?.[0];
 if(!f)return alert("First select the Sales Contract PDF/Image.");
 $("ocrStatus").innerHTML="⏳ Loading document reader…";
 try{
   let text="";
   if(f.type==="application/pdf" || /\.pdf$/i.test(f.name)){
     await ensurePdfJS();
     $("ocrStatus").innerHTML="⏳ Reading PDF text…";
     const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
     for(let i=1;i<=pdf.numPages;i++){
       const pg=await pdf.getPage(i);
       const tc=await pg.getTextContent();
       text+=tc.items.map(x=>x.str).join(" ")+"\\n";
     }
     // If PDF has no text layer, use OCR on rendered pages.
     if(text.replace(/\s/g,"").length<30){
       await ensureTesseract();
       $("ocrStatus").innerHTML="⏳ PDF is scanned — OCR is running…";
       for(let i=1;i<=pdf.numPages;i++){
         const pg=await pdf.getPage(i), vp=pg.getViewport({scale:1.7});
         const cv=document.createElement("canvas"),ctx=cv.getContext("2d");
         cv.width=vp.width;cv.height=vp.height;
         await pg.render({canvasContext:ctx,viewport:vp}).promise;
         const r=await Tesseract.recognize(cv,"eng",{logger:m=>{
           if(m.status) $("ocrStatus").textContent="⏳ OCR "+Math.round((m.progress||0)*100)+"%";
         }});
         text+="\\n"+(r.data.text||"");
       }
     }
   }else{
     await ensureTesseract();
     $("ocrStatus").innerHTML="⏳ OCR is running…";
     const r=await Tesseract.recognize(f,"eng",{logger:m=>{
       if(m.status) $("ocrStatus").textContent="⏳ OCR "+Math.round((m.progress||0)*100)+"%";
     }});
     text=r.data.text||"";
   }
   if(!text.trim()) throw new Error("No readable text found");
   parseContractText(text);
   $("ocrStatus").innerHTML="✅ Contract read successfully. Please verify/edit before saving.";
 }catch(e){
   console.error(e);
   $("ocrStatus").innerHTML="⚠️ Reader could not process this file. Try the PDF again or enter/edit the fields manually.";
 }
}
function loadScript(src){
 return new Promise((resolve,reject)=>{
  if(document.querySelector('script[src="'+src+'"]')){ 
    let n=0;const timer=setInterval(()=>{if((src.includes("pdf")&&window.pdfjsLib)||(src.includes("tesseract")&&window.Tesseract)){clearInterval(timer);resolve();}if(++n>100){clearInterval(timer);reject(new Error("Script load timeout"));}},100);
    return;
  }
  const sc=document.createElement("script");sc.src=src;sc.async=true;
  sc.onload=resolve;sc.onerror=()=>reject(new Error("Could not load reader library"));document.head.appendChild(sc);
 });
}
async function ensurePdfJS(){
 if(window.pdfjsLib)return;
 const src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 await loadScript(src);
 if(!window.pdfjsLib)throw new Error("PDF.js unavailable");
 window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
async function ensureTesseract(){
 if(window.Tesseract)return;
 await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
 if(!window.Tesseract)throw new Error("Tesseract unavailable");
}
function setv(id,v){if(v && $(id)) $(id).value=String(v).trim();}
function cleanLine(v){
 return String(v||"").replace(/\s+/g," ").replace(/^[\s:;,\-]+|[\s:;,\-]+$/g,"").trim();
}
function linesOf(t){
 return t.replace(/\r/g,"\n").split("\n").map(cleanLine).filter(x=>x.length>1);
}
function valueAfterLabel(lines, labels){
 for(let i=0;i<lines.length;i++){
   const l=lines[i];
   for(const lab of labels){
     const re=new RegExp("^"+lab.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*(?:No\\.?|Number)?\\s*[:\\-]?\\s*(.*)$","i");
     const m=l.match(re);
     if(m && cleanLine(m[1]) && !/^(no|number|date|details)$/i.test(m[1])) return cleanLine(m[1]);
     if(m){
       for(let j=i+1;j<Math.min(i+3,lines.length);j++){
         if(lines[j] && !/^(seller|buyer|exporter|importer|consignee|date|gstin|iec|pan|hs code|commodity|quantity|price|payment terms)/i.test(lines[j])) return lines[j];
       }
     }
   }
 }
 return "";
}
function extractCompany(lines, labels){
 for(let i=0;i<lines.length;i++){
   for(const lab of labels){
     if(new RegExp("^"+lab+"\\s*[:\\-]?\\s*$","i").test(lines[i])){
       for(let j=i+1;j<Math.min(i+4,lines.length);j++){
         const v=cleanLine(lines[j]);
         if(v && v.length>4 && !/^(buyer|seller|gstin|iec|pan|hs code|commodity|quantity|price|payment|date)\b/i.test(v)) return v;
       }
     }
     const m=lines[i].match(new RegExp("^"+lab+"\\s*[:\\-]\\s*(.+)$","i"));
     if(m && cleanLine(m[1]).length>4)return cleanLine(m[1]);
   }
 }
 return "";
}
function parseContractText(t){
 const lines=linesOf(t);
 const x=lines.join("\n");
 // Contract number: require a label. Do not accept random OCR words such as "This".
 let no="";
 const noPatterns=[
  /(?:sales\s+contract|contract)\s*(?:no\.?|number)\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\/._-]{3,})/i,
  /(?:contract\s*(?:ref|reference))\s*[:#\-]?\s*([A-Z0-9][A-Z0-9\/._-]{3,})/i
 ];
 for(const re of noPatterns){const m=x.match(re);if(m){no=cleanLine(m[1]);break;}}
 if(no && !/^(this|the|date|number)$/i.test(no))setv("sc",no);else if($("sc"))$("sc").value="";

 let date="";
 const dm=x.match(/(?:contract\s+date|date\s+of\s+contract)\s*[:\-]?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
 if(dm){
   const a=dm[1].split(/[\/.\-]/), y=a[2].length===2?"20"+a[2]:a[2];
   // Source document commonly uses DD/MM/YYYY.
   setv("date",`${y}-${a[1].padStart(2,"0")}-${a[0].padStart(2,"0")}`);
 }

 let seller=extractCompany(lines,["seller","exporter","supplier"]);
 let buyer=extractCompany(lines,["buyer","importer","consignee"]);
 if(seller && !/payment|account|bank charge|within|days/i.test(seller))setv("seller",seller);else if($("seller"))$("seller").value="";
 if(buyer && !/payment|account|bank charge|within|days|seller/i.test(buyer))setv("buyer",buyer);else if($("buyer"))$("buyer").value="";

 let gst=(x.match(/(?:GSTIN|GST\s*NO\.?)\s*[:\-]?\s*([A-Z0-9]{15})/i)||[])[1]||"";
 let iec=(x.match(/(?:IEC|I\.E\.C\.)\s*(?:CODE|NO\.?)?\s*[:\-]?\s*([A-Z0-9]{10})/i)||[])[1]||"";
 let pan=(x.match(/(?:PAN|P\.A\.N\.)\s*[:\-]?\s*([A-Z]{5}\d{4}[A-Z])/i)||[])[1]||"";
 let hs=(x.match(/(?:HS\s*CODE|HSN)\s*[:\-]?\s*(\d{8})/i)||[])[1]||"";
 setv("gst",gst);setv("iec",iec);setv("pan",pan);setv("hs",hs);

 let commodity=valueAfterLabel(lines,["commodity","description of goods","goods description"]);
 if(!commodity){
   const m=x.match(/(?:ALUMIN[IU]UM)[^.\n]{5,100}(?:ISRI|SCRAP|TREAD|TALON)[^.\n]*/i);if(m)commodity=cleanLine(m[0]);
 }
 setv("commodity",commodity);

 let qty=(x.match(/(?:total\s+quantity|quantity)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)\s*(?:MT|M\.T\.|METRIC\s+TONS?)/i)||[])[1]||"";
 if(!qty){const m=x.match(/(\d+(?:[.,]\d+)?)\s*(?:MT|M\.T\.|METRIC\s+TONS?)/i);if(m)qty=m[1];}
 setv("qty",qty.replace(/,/g,""));

 let cp=(x.match(/(?:container\s+plan)\s*[:\-]?\s*([^\n]+)/i)||[])[1]||"";
 if(!cp){const m=x.match(/(\d+\s*[xX×]\s*(?:20|40)\s*(?:['’]?\s*(?:FT|CONTAINER))?)/i);if(m)cp=cleanLine(m[1]);}
 setv("cp",cp);

 // Price: only accept a USD value explicitly associated with price/rate and per MT.
 let price="";
 const p1=x.match(/(?:price|rate)\s*(?:per\s*mt|\/\s*mt|usd\s*\/\s*mt)?\s*[:\-]?\s*(?:usd|us\$|\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i);
 const p2=x.match(/(?:usd|us\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)\s*(?:\/\s*mt|per\s*mt)/i);
 if(p1)price=p1[1]; else if(p2)price=p2[1];
 setv("price",price.replace(/,/g,""));

 let term=(x.match(/\b(CIF\s+[A-Z][A-Z ,.-]{2,80})/i)||[])[1]||"";
 setv("term",cleanLine(term));

 let pol=valueAfterLabel(lines,["port of loading","loading port"]);
 let pod=valueAfterLabel(lines,["port of discharge","discharge port"]);
 setv("pol",pol);setv("pod",pod);

 // Shipment period: take only the sentence beginning with shipment/loading, not the next payment section.
 let ship=(x.match(/(?:shipment\s+period|shipment|delivery)\s*[:\-]?\s*([^\n]{8,150})/i)||[])[1]||"";
 setv("ship",cleanLine(ship));

 let trans=(x.match(/transshipment\s*[:\-]?\s*(ALLOWED|NOT ALLOWED|PROHIBITED)/i)||[])[1]||"";
 let partial=(x.match(/partial\s+shipment\s*[:\-]?\s*(ALLOWED|NOT ALLOWED|PROHIBITED)/i)||[])[1]||"";
 setv("trans",trans);setv("partial",partial);

 // Payment terms are kept together. Advance is extracted separately from the same text.
 let pay="";
 const payIdx=lines.findIndex(l=>/^(payment\s+terms?|terms\s+of\s+payment|payment\s+remarks?)/i.test(l));
 if(payIdx>=0)pay=lines.slice(payIdx+1,payIdx+5).join(" ");
 if(!pay)pay=(x.match(/(?:payment\s+terms?|terms\s+of\s+payment)\s*[:\-]?\s*([^\n]{10,300})/i)||[])[1]||"";
 pay=cleanLine(pay);
 let adv="";
 const am=pay.match(/(?:US\$|USD|\$)\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{1,2})?)/i);
 if(am)adv=am[1].replace(/,/g,"");
 setv("adv",adv);
 setv("remarks",pay);

 // Contract value is shown in the dedicated field and never appended to Payment Terms.
 if($("contractValue")){
   const p=parseFloat(($("price")?.value||"").replace(/,/g,""));
   const q=parseFloat(($("qty")?.value||"").replace(/,/g,""));
   $("contractValue").value=(p>0&&q>0)?(p*q).toFixed(2):"";
 }
}
function create(){let no=$("sc").value.trim();if(!no)return alert("Contract No. required.");if(get(no))return alert("Already exists.");db.contracts.push({no,date:$("date").value,seller:$("seller").value,buyer:$("buyer").value,gstin:$("gst").value,iec:$("iec").value,pan:$("pan").value,hs:$("hs").value,commodity:$("commodity").value,qty:$("qty").value,containerPlan:$("cp").value,price:$("price").value,term:$("term").value,pol:$("pol").value,pod:$("pod").value,ship:$("ship").value,advanceAmt:$("adv").value,trans:$("trans").value,partial:$("partial").value,remarks:$("remarks").value,contractFile:file("cf"),bookings:[]});save();cur=no;alert("Contract saved");openPage("booking")}
function list(){$("list").innerHTML=db.contracts.map(c=>`<div class="item"><b>${esc(c.no)}</b><br>${esc(c.buyer)} | ${esc(c.commodity)} | ${esc(c.qty)} MT | USD ${esc(c.price)}/MT<br><button class="btn p" onclick="openPage('booking','${esc(c.no)}')">Open</button></div>`).join("")||"<p>No contracts.</p>"}
function search(){let c=get($("q").value);if(c){cur=c.no;openPage("booking",c.no)}else alert("Contract not found")}
function head(c){return `<div class="item"><b>${esc(c.no)}</b><br><span class="muted">${esc(c.buyer)} | ${esc(c.commodity)} | Contract ${esc(c.qty)} MT | USD ${esc(c.price)}/MT</span></div>`}
function booking(){let c=get(cur);shell("🚢 Booking",head(c)+`<div class="card"><div class="grid">${field("bn","Booking No.")}${field("cn","Container No.")}${field("bq","Quantity (MT)")}${field("bv","Vessel")}${field("be","ETD","date")}${field("ba","ETA","date")}${field("bf","Booking PDF/Image","file",1)}</div><button class="btn p" onclick="addB()">Save Booking</button></div><h3>All Bookings</h3>${c.bookings.map((b,i)=>`<div class="item"><b>Booking ${i+1}: ${esc(b.no)}</b><br>Container ${esc(b.container)} | ${esc(b.qty)} MT | ${esc(b.vessel)} | ETA ${esc(b.eta)}<br>${b.released?'<span class="badge">RELEASED ✓</span>':'<button class="btn w" onclick="releaseB('+i+')">🚢 RELEASE</button>'}</div>`).join("")||"<p>No bookings.</p>"}`)}
function addB(){let c=get(cur);c.bookings.push({no:$("bn").value,container:$("cn").value,qty:$("bq").value,vessel:$("bv").value,etd:$("be").value,eta:$("ba").value,file:file("bf"),released:false});save();booking()}
function releaseB(i){get(cur).bookings[i].released=true;save();alert("Booking released. Advance unlocked.");openPage("advance",cur)}
function advance(){let c=get(cur);shell("💵 Advance Payment",head(c)+`<div class="ok">Booking released — Advance Payment unlocked.</div><div class="grid">${field("aa","Advance USD")}${field("ad","Payment Date","date")}${field("ar","Exchange Rate")}${field("ai","INR Amount")}${field("ax","Reference")}${field("af","Payment Copy","file",1)}</div><button class="btn s" onclick="saveAdvance()">Save Advance Payment</button>`)}
function saveAdvance(){let c=get(cur);c.advance={amount:$("aa").value,date:$("ad").value,rate:$("ar").value,inr:$("ai").value,ref:$("ax").value,file:file("af")};save();openPage("loading",cur)}
function loading(){let c=get(cur);shell("📦 Loading / Bill of Lading",head(c)+`<div class="ok">Advance completed — Loading/B/L unlocked.</div><div class="grid">${field("lb","B/L No.")}${field("lv","Vessel")}${field("lg","Voyage")}${field("ld","Loading Date","date")}${field("lq","Loaded Quantity (KG)")}${field("lc","Container / Seal No.","textarea",1)}${field("lf","Loading / B/L PDF","file",1)}</div><button class="btn s" onclick="saveLoading()">Save Loading/B/L</button>`)}
function saveLoading(){let c=get(cur);c.loading={bl:$("lb").value,vessel:$("lv").value,voyage:$("lg").value,date:$("ld").value,qty:$("lq").value,containers:$("lc").value,file:file("lf")};save();openPage("invoice",cur)}
function invoice(){let c=get(cur);shell("🧾 Final Invoice",head(c)+`<div class="ok">Loading/B/L completed — Invoice unlocked.</div><div class="grid">${field("ino","Invoice No.")}${field("id","Invoice Date","date")}${field("iq","Invoice Quantity (MT)")}${field("ip","Unit Price USD/MT")}${field("iv","Invoice Amount USD")}${field("ia","Advance Deducted USD")}${field("ib","Balance USD")}${field("if","Invoice Copy","file",1)}</div><button class="btn s" onclick="saveInvoice()">Save Final Invoice</button>`)}
function saveInvoice(){let c=get(cur),v=+($("iv").value||0),a=+($("ia").value||0);c.invoice={no:$("ino").value,date:$("id").value,qty:$("iq").value,price:$("ip").value,amount:$("iv").value,advance:$("ia").value,balance:(v-a).toFixed(2),file:file("if")};save();openPage("boe",cur)}
function boe(){let c=get(cur);shell("🛃 Bill of Entry",head(c)+`<div class="ok">Invoice completed — Bill of Entry unlocked.</div><div class="grid">${field("ben","BE No.")}${field("bed","BE Date","date")}${field("bev","Invoice Value USD")}${field("bea","Assessable Value INR")}${field("bedu","Total Duty INR")}${field("ber","Exchange Rate")}${field("beo","OOC No.")}${field("beod","OOC Date","date")}${field("bef","BOE PDF","file",1)}</div><button class="btn s" onclick="saveBoe()">Save Bill of Entry</button>`)}
function saveBoe(){let c=get(cur);c.boe={no:$("ben").value,date:$("bed").value,value:$("bev").value,assess:$("bea").value,duty:$("bedu").value,rate:$("ber").value,ooc:$("beo").value,oocDate:$("beod").value,file:file("bef")};save();openPage("finalpay",cur)}
function finalpay(){let c=get(cur);shell("💰 Final Payment",head(c)+`<div class="ok">Bill of Entry completed — Final Payment unlocked.</div><div class="grid">${field("fa","Final Payment USD")}${field("fd","Payment Date","date")}${field("fr","Exchange Rate")}${field("fi","INR Amount")}${field("fx","Reference")}${field("ff","Payment Copy","file",1)}</div><button class="btn s" onclick="saveFinalPay()">Save Final Payment</button>`)}
function saveFinalPay(){let c=get(cur);c.finalpay={amount:$("fa").value,date:$("fd").value,rate:$("fr").value,inr:$("fi").value,ref:$("fx").value,file:file("ff")};save();openPage("final",cur)}
function finalRec(){let c=get(cur);shell("📄 Final Record",head(c)+`<div class="ok">Final Payment completed — Final Record unlocked.</div><table><tr><th>Stage</th><th>Record</th></tr><tr><td>Contract</td><td>USD ${esc(c.price)}/MT | ${esc(c.qty)} MT</td></tr><tr><td>Booking</td><td>${c.bookings.length} booking(s)</td></tr><tr><td>Advance</td><td>USD ${esc(c.advance?.amount)}</td></tr><tr><td>Loading/B/L</td><td>${esc(c.loading?.bl)} | ${esc(c.loading?.qty)} KG</td></tr><tr><td>Invoice</td><td>${esc(c.invoice?.no)} | USD ${esc(c.invoice?.amount)}</td></tr><tr><td>Bill of Entry</td><td>${esc(c.boe?.no)} | Duty INR ${esc(c.boe?.duty)}</td></tr><tr><td>Final Payment</td><td>USD ${esc(c.finalpay?.amount)} | INR ${esc(c.finalpay?.inr)}</td></tr></table><div class="card"><label>Final Document</label><input id="ffinal" class="file" type="file" accept=".pdf,image/*"><button class="btn s" onclick="complete()">✅ Complete Final Record</button></div>${c.final?'<div class="ok">✅ FINAL RECORD COMPLETED</div>':''}`)}
function complete(){let c=get(cur),f=file("ffinal");if(!f)return alert("Upload final document.");c.final={file:f,date:new Date().toISOString()};save();finalRec()}
document.addEventListener("input",e=>{if(e.target.id==="price"||e.target.id==="qty"){let p=parseFloat($("price")?.value||0),q=parseFloat($("qty")?.value||0);if($("contractValue"))$("contractValue").value=p&&q?(p*q).toFixed(2):"";}});render();
</script></body></html>
